name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Required for a merge queue (ADR-0061). The queue runs the required checks
  # against a temporary `merge_group` ref holding the prospective merged result,
  # and a required check that does not trigger on that event never reports — so
  # the queue waits for it forever and nothing merges at all. This trigger must
  # therefore land *before* the queue is switched on, not with it.
  merge_group:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt · clippy · test)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all

  extension:
    name: VS Code extension (lint · compile)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format
      - name: Test
        run: npm test
      - name: Compile
        run: npm run compile
      # A fragment that cannot be placed is silently lost at release (ADR-0056).
      # The pre-commit hook catches it locally; this catches a push that skipped
      # hooks, and costs nothing when changelog.d is empty.
      - name: Changelog fragments
        run: node scripts/changelog.mjs --check
        working-directory: .
      # The guards the fleet trusts to stay honest - conformance gate, merge
      # driver, claim gate, publication record, delivery queue, board health -
      # test themselves here. They were written and wired into nothing.
      - name: Script tests
        run: node scripts/script-tests.mjs
        working-directory: .

  extension-host:
    name: VS Code 1.93 Extension Host smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build native servers
        run: cargo build --release --locked -p mindleak-mcp -p lodestar-mcp
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Install extension dependencies
        run: npm --prefix editors/vscode ci
      - name: Run live Extension Host smoke
        run: npm --prefix editors/vscode run test:extension-host

  coverage:
    name: Coverage (Rust + VS Code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Install extension dependencies
        run: npm --prefix editors/vscode ci
      - name: Run tests with coverage
        run: make coverage
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.sha }}
          path: |
            coverage.lcov
            editors/vscode/coverage/vitest
          if-no-files-found: error
          retention-days: 14
