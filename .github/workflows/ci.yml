name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Required for a merge queue (ADR-0061). The queue runs the required checks
  # against a temporary `merge_group` ref holding the prospective merged result,
  # and a required check that does not trigger on that event never reports — so
  # the queue waits for it forever and nothing merges at all. This trigger must
  # therefore land *before* the queue is switched on, not with it.
  merge_group:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The backstop for silently stranded work. A merged pull request whose commits
  # never reached main fails nothing anywhere else: the pull request reads
  # merged, the branch reads ahead, CI is green on both. This detector existed
  # and caught PR #37 and PR #134 in hindsight, but ran only when somebody
  # remembered to type `make merge-audit`, which is to say almost never.
  #
  # Only on main, never on pull requests: the question is "did the thing that
  # just merged leave work behind", which is not a question about a branch that
  # has not merged yet.
  merge-audit:
    name: Merged branches left nothing behind
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Audit
        run: node scripts/merge-audit.mjs
        env:
          GH_TOKEN: ${{ github.token }}

  rust:
    name: Rust (fmt · clippy · test)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all
      # gaps.d/the-credential-facility-signer-is-unverified-outside-windows.md:
      # this test already prints which branch it took, but a passing test's
      # stdout is otherwise discarded, so the distinction was invisible here.
      # ubuntu-latest only: this is the platform the gap is about; a real
      # pass has already been confirmed by hand on Windows.
      # Best-effort: failing to install/start a Secret Service provider must
      # not turn this required check's existing soft "skipped" outcome into a
      # hard failure, so apt-get is allowed to fail without blocking the job.
      - name: Install a Secret Service provider (Linux)
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring dbus-x11
      - name: Report credential-facility test coverage (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          if command -v dbus-run-session >/dev/null 2>&1 && command -v gnome-keyring-daemon >/dev/null 2>&1; then
            dbus-run-session -- bash -c '
              eval "$(printf "\n" | gnome-keyring-daemon --unlock --components=secrets)"
              cargo test -p ackplane-client a_stored_seed_round_trips_through_the_real_credential_facility -- --nocapture
            '
          else
            cargo test -p ackplane-client a_stored_seed_round_trips_through_the_real_credential_facility -- --nocapture
          fi

  # ADR-0088 keeps the repository-local planes usable without Ackplane's
  # container and PostgreSQL stack. Dependencies are installed before this
  # proof; the commands under test then have no package registry escape hatch.
  local-planes:
    name: Local planes (no containers, PostgreSQL, or network)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # This job's cache entry served pre-built test binaries that did not
          # reflect the checked-out commit for an extended period: PR #484's
          # own local-planes run passed without ever running the test it
          # added. Bumping the prefix starts a fresh, correctly-keyed cache.
          prefix-key: v1-local-planes
      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Install extension dependencies
        run: npm --prefix editors/vscode ci
      - name: Build local planes offline
        run: cargo build --locked --offline
        env:
          CARGO_NET_OFFLINE: "true"
      - name: Test local planes offline
        run: cargo test --all --locked --offline
        env:
          CARGO_NET_OFFLINE: "true"
      - name: Test extension offline
        run: npm --prefix editors/vscode test
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9

  extension:
    name: VS Code extension (lint · compile)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format
      - name: Test
        run: npm test
      - name: Compile
        run: npm run compile
      # A fragment that cannot be placed is silently lost at release (ADR-0056).
      # The pre-commit hook catches it locally; this catches a push that skipped
      # hooks, and costs nothing when changelog.d is empty.
      - name: Changelog fragments
        run: node scripts/changelog.mjs --check
        working-directory: .
      # The guards the fleet trusts to stay honest - conformance gate, merge
      # driver, claim gate, publication record, delivery queue, board health -
      # test themselves here. They were written and wired into nothing.
      - name: Script tests
        run: node scripts/script-tests.mjs
        working-directory: .

  # ADR-0104: proves the wire contract an external consumer depends on still
  # holds, using only the published protocol -- never mindleak-core/
  # lodestar-core directly, or it would stop proving what it claims to prove.
  reference-consumer:
    name: Reference consumer (tool surface compatibility)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build native servers
        run: cargo build --release --locked -p mindleak-mcp -p lodestar-mcp
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: clients/node/mindleak-client/package-lock.json
      - name: Install reference client dependencies
        run: npm ci
        working-directory: clients/node/mindleak-client
      - name: Build reference client
        run: npm run build
        working-directory: clients/node/mindleak-client
      - name: Run the reference-consumer gate
        run: node scripts/reference-consumer.mjs

  extension-host:
    name: VS Code 1.101 Extension Host smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build native servers
        run: cargo build --release --locked -p mindleak-mcp -p lodestar-mcp
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Install extension dependencies
        run: npm --prefix editors/vscode ci
      - name: Run live Extension Host smoke
        run: npm --prefix editors/vscode run test:extension-host

  coverage:
    name: Coverage (Rust + VS Code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Install extension dependencies
        run: npm --prefix editors/vscode ci
      - name: Run tests with coverage
        run: make coverage
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.sha }}
          path: |
            coverage.lcov
            editors/vscode/coverage/vitest
          if-no-files-found: error
          retention-days: 14
