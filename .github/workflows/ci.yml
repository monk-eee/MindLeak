name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Required for a merge queue (ADR-0061). The queue runs the required checks
  # against a temporary `merge_group` ref holding the prospective merged result,
  # and a required check that does not trigger on that event never reports — so
  # the queue waits for it forever and nothing merges at all. This trigger must
  # therefore land *before* the queue is switched on, not with it.
  merge_group:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The hosted npm proxy can return short-lived 503s during `npm ci`. Keep
  # retries bounded and platform-neutral so a transient fetch outage does not
  # fail an otherwise unrelated Windows or Linux verification job.
  NPM_CONFIG_FETCH_RETRIES: "5"
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "10000"
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "60000"

jobs:
  # The backstop for silently stranded work. A merged pull request whose commits
  # never reached main fails nothing anywhere else: the pull request reads
  # merged, the branch reads ahead, CI is green on both. This detector existed
  # and caught PR #37 and PR #134 in hindsight, but ran only when somebody
  # remembered to type `make merge-audit`, which is to say almost never.
  #
  # Only on main, never on pull requests: the question is "did the thing that
  # just merged leave work behind", which is not a question about a branch that
  # has not merged yet.
  merge-audit:
    name: Merged branches left nothing behind
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Audit
        run: node scripts/merge-audit.mjs
        env:
          GH_TOKEN: ${{ github.token }}

  # migrate_locked hashes a migration's whole file, so editing one that has
  # already applied leaves its key held under content no committed source
  # matches, and every connect() reaching it then refuses. Measured 2026-09-02:
  # a split of an already-applied 0060 cost 58 test failures across five
  # unrelated subsystems, none of which named the cause.
  #
  # Unlike merge-audit this runs on pull requests too, because the whole point
  # is to refuse the edit before it lands rather than to report it afterwards.
  # fetch-depth: 0 so origin/main is resolvable; without it the check reports
  # that it cannot answer, and says so rather than passing quietly.
  migration-audit:
    name: Migrations already applied are not edited
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Audit
        run: node scripts/migration-audit.mjs --check

  rust:
    name: Rust (fmt · clippy · test)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all
      # gaps.d/the-credential-facility-signer-is-unverified-outside-windows.md:
      # this test already prints which branch it took, but a passing test's
      # stdout is otherwise discarded, so the distinction was invisible here.
      # ubuntu-latest only: this is the platform the gap is about; a real
      # pass has already been confirmed by hand on Windows.
      # Best-effort: failing to install/start a Secret Service provider must
      # not turn this required check's existing soft "skipped" outcome into a
      # hard failure, so apt-get is allowed to fail without blocking the job.
      - name: Install a Secret Service provider (Linux)
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring dbus-x11
      - name: Report credential-facility test coverage (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          if command -v dbus-run-session >/dev/null 2>&1 && command -v gnome-keyring-daemon >/dev/null 2>&1; then
            dbus-run-session -- bash -c '
              eval "$(printf "\n" | gnome-keyring-daemon --unlock --components=secrets)"
              cargo test -p ackplane-client a_stored_seed_round_trips_through_the_real_credential_facility -- --nocapture
            '
          else
            cargo test -p ackplane-client a_stored_seed_round_trips_through_the_real_credential_facility -- --nocapture
          fi

  credential-facility-macos:
    name: Credential facility (macOS Keychain)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Require a real Keychain round trip
        env:
          MINDLEAK_REQUIRE_CREDENTIAL_FACILITY: "1"
        run: cargo test -p ackplane-client a_stored_seed_round_trips_through_the_real_credential_facility -- --nocapture

  # ADR-0088 keeps the repository-local planes usable without Ackplane's
  # container and PostgreSQL stack. Dependencies are installed before this
  # proof; the commands under test then have no package registry escape hatch.
  local-planes:
    name: Local planes (no containers, PostgreSQL, or network)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # This job's cache entry served pre-built test binaries that did not
          # reflect the checked-out commit for an extended period: PR #484's
          # own local-planes run passed without ever running the test it
          # added. Bumping the prefix starts a fresh, correctly-keyed cache.
          prefix-key: v1-local-planes
      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Install extension dependencies
        run: node scripts/npm-ci-retry.mjs --prefix editors/vscode
      - name: Build local planes offline
        run: cargo build --locked --offline
        env:
          CARGO_NET_OFFLINE: "true"
      - name: Test local planes offline
        run: cargo test --all --locked --offline
        env:
          CARGO_NET_OFFLINE: "true"
      - name: Test extension offline
        run: npm --prefix editors/vscode test
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9

  ackplane-image:
    name: Ackplane server image (the standalone deployment path)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The only job that compiles against the workspace's declared
      # `rust-version` floor. Every other job installs
      # `dtolnay/rust-toolchain@stable`, so a dependency raising its own MSRV
      # breaks the standalone deployment while CI stays entirely green — which
      # is exactly how the pinned 1.85 base became unbuildable without anyone
      # noticing. Building the image is the only thing that catches it.
      - name: Build the server image
        run: docker build -f crates/ackplane-server/Dockerfile -t ackplane-server:ci .

  extension:
    name: VS Code extension (lint · compile)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Install
        run: node ../../scripts/npm-ci-retry.mjs
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format
      - name: Test
        run: npm test
      - name: Compile
        run: npm run compile
      # A fragment that cannot be placed is silently lost at release (ADR-0056).
      # The pre-commit hook catches it locally; this catches a push that skipped
      # hooks, and costs nothing when changelog.d is empty.
      - name: Changelog fragments
        run: node scripts/changelog.mjs --check
        working-directory: .
      # The guards the fleet trusts to stay honest - conformance gate, merge
      # driver, claim gate, publication record, delivery queue, board health -
      # test themselves here. They were written and wired into nothing.
      - name: Script tests
        run: node scripts/script-tests.mjs
        working-directory: .

  # ADR-0104: proves the wire contract an external consumer depends on still
  # holds, using only the published protocol -- never mindleak-core/
  # lodestar-core directly, or it would stop proving what it claims to prove.
  reference-consumer:
    name: Reference consumer (tool surface compatibility)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build native servers
        # Match the release build (see release.yml): CI must exercise the same
        # binary configuration that ships, or the federated path is never
        # compiled by any gate.
        run: >-
          cargo build --release --locked -p mindleak-mcp -p lodestar-mcp
          --features mindleak-mcp/federation-client,lodestar-mcp/federation-client
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: clients/node/mindleak-client/package-lock.json
      - name: Install reference client dependencies
        run: node ../../../scripts/npm-ci-retry.mjs
        working-directory: clients/node/mindleak-client
      - name: Build reference client
        run: npm run build
        working-directory: clients/node/mindleak-client
      - name: Run the reference-consumer gate
        run: node scripts/reference-consumer.mjs

  extension-host:
    name: VS Code 1.101 Extension Host smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build native servers
        # Match the release build (see release.yml).
        run: >-
          cargo build --release --locked -p mindleak-mcp -p lodestar-mcp
          --features mindleak-mcp/federation-client,lodestar-mcp/federation-client
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Install extension dependencies
        run: node scripts/npm-ci-retry.mjs --prefix editors/vscode
      - name: Run live Extension Host smoke
        run: npm --prefix editors/vscode run test:extension-host

  coverage:
    name: Coverage (Rust + VS Code)
    runs-on: ubuntu-latest
    # ADR-0118: a real Postgres service, pinned to the same image and
    # credentials as docker-compose.yml, so ackplane-server's
    # ACKPLANE_TEST_DATABASE_URL-gated tests execute here instead of
    # hollow-skipping and undercounting the coverage measurement.
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: ackplane
          POSTGRES_PASSWORD: ackplane-development-only-not-for-production
          POSTGRES_DB: ackplane
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ackplane -d ackplane"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Install extension dependencies
        run: node scripts/npm-ci-retry.mjs --prefix editors/vscode
      - name: Run tests with coverage
        env:
          ACKPLANE_TEST_REHEARSAL_DATABASE_URL: postgresql://ackplane:ackplane-development-only-not-for-production@localhost:5432/ackplane
          ACKPLANE_TEST_DATABASE_URL: postgres://ackplane:ackplane-development-only-not-for-production@localhost:5432/ackplane
        run: make coverage
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.sha }}
          path: |
            coverage.lcov
            editors/vscode/coverage/vitest
          if-no-files-found: error
          retention-days: 14
