syntax = "proto3";

package mindleak.ackplane.v1;

service NodeSyncService {
  rpc Synchronize(stream NodeFrame) returns (stream AckplaneFrame);
}

service NodeEnrollmentService {
  rpc SubmitEnrollmentRequest(EnrollmentRequest) returns (EnrollmentRequestStatus);
  rpc GetActivationChallenge(EnrollmentChallengeRequest) returns (EnrollmentChallenge);
  rpc ActivateEnrollment(EnrollmentActivationProof) returns (EnrollmentActivationResult);
  rpc RotateNodeKey(KeyRotationRequest) returns (KeyRotationResult);
  rpc CheckEnrollmentStatus(EnrollmentStatusRequest) returns (EnrollmentStatusResult);
}

service ClaimDelegationService {
  rpc DelegateClaim(ClaimLeaseRequest) returns (ClaimLeaseResult);
  rpc ReleaseClaim(ClaimReleaseRequest) returns (ClaimReleaseResult);
  rpc RenewClaim(ClaimRenewRequest) returns (ClaimLeaseResult);
  rpc RecoverClaim(ClaimRecoverRequest) returns (ClaimLeaseResult);
  rpc ListActiveClaims(ActiveClaimsRequest) returns (ActiveClaimsResult);
}

// ADR-0106 decision 3: knowledge is one of the PostgreSQL-backed Industrial
// domains -- first slice: record, recall (ranked by pgvector similarity
// search when a query embedding is supplied, else by recency), and retire.
service KnowledgeService {
  rpc RecordKnowledge(RecordKnowledgeRequest) returns (KnowledgeRecord);
  rpc RecallKnowledge(RecallKnowledgeRequest) returns (RecallKnowledgeResult);
  rpc GetKnowledgeHistory(KnowledgeHistoryRequest) returns (KnowledgeHistoryResult);
  rpc ReconfirmKnowledge(ReconfirmKnowledgeRequest) returns (ReconfirmKnowledgeResult);
  rpc RetireKnowledge(RetireKnowledgeRequest) returns (RetireKnowledgeResult);
}

// ADR-0106 decision 3: Evidence is a PostgreSQL-backed Industrial domain.
// The first contract preserves bounded references, digests, and provenance;
// it never transmits terminal output, source text, or credentials as evidence.
service EvidenceService {
  rpc RecordEvidence(RecordEvidenceRequest) returns (EvidenceRecord);
  rpc ListEvidence(ListEvidenceRequest) returns (ListEvidenceResult);
  rpc RecordConformance(RecordConformanceRequest) returns (ConformanceRecord);
  rpc ListConformance(ListConformanceRequest) returns (ListConformanceResult);
}

// ADR-0105 decision 6: the Industrial profile reports typed operational
// telemetry rather than forwarding local tool logs or terminal output.
service TelemetryService {
  rpc RecordTelemetry(RecordTelemetryRequest) returns (TelemetryRecord);
  rpc ReadTelemetry(TelemetryReadRequest) returns (TelemetrySnapshot);
}

// ADR-0106 decision 3: Constitution is a read-only projection of a
// repository's own authoritative local Lodestar constitution -- published
// here by that repository's tooling so Bridge can surface an enrolled
// repository's active governance without either plane inspecting the
// other's storage directly. No adopt/tailor/reject/promote/waiver action
// lives here: this domain mirrors the local constitution, it never edits it.
service ConstitutionService {
  rpc PublishConstitutionSnapshot(PublishConstitutionSnapshotRequest) returns (PublishConstitutionSnapshotResult);
  rpc GetActiveConstitution(GetActiveConstitutionRequest) returns (GetActiveConstitutionResult);
}

// The enrolled node's proof that it, not just its bearer credentials, is
// asking for this claim (ADR-0096 clause 4's authentication gap). Reuses the
// same Ed25519 signing key and domain-separated verification
// `signing_keys::resolve` already provides for envelopes and connections
// (ADR-0084, ADR-0098) -- not a new trust scheme.
message ClaimAuthentication {
  string signing_key_id = 1;
  string node_id = 2;
  string signed_at = 3;
  bytes nonce = 4;
  bytes signature = 5;
}

// The enrolled node's proof for a KnowledgeService request (ADR-0108). A
// distinct message, domain, and nonce space from ClaimAuthentication: a
// knowledge statement has no equivalent of a claim's branch/lease/paths, so
// binding claim fields here would sign nothing meaningful, and sharing one
// nonce table would couple two unrelated domains' replay protection.
message KnowledgeAuthentication {
  string signing_key_id = 1;
  string node_id = 2;
  string signed_at = 3;
  bytes nonce = 4;
  bytes signature = 5;
}

// The enrolled node's proof for an EvidenceService request. This has a
// distinct domain and nonce space from claims, knowledge, and constitutions:
// an evidence record binds task, kind, reference, digest, time, and session.
message EvidenceAuthentication {
  string signing_key_id = 1;
  string node_id = 2;
  string signed_at = 3;
  bytes nonce = 4;
  bytes signature = 5;
}

// Telemetry has its own signature domain and nonce space. A telemetry report
// is neither a claim nor a knowledge statement, so sharing either request's
// authentication would permit a signature to cross an unrelated operation.
message TelemetryAuthentication {
  string signing_key_id = 1;
  string node_id = 2;
  string signed_at = 3;
  bytes nonce = 4;
  bytes signature = 5;
}

enum TelemetrySignalKind {
  TELEMETRY_SIGNAL_KIND_UNSPECIFIED = 0;
  TELEMETRY_SIGNAL_KIND_TOOL = 1;
  TELEMETRY_SIGNAL_KIND_TRANSPORT = 2;
  TELEMETRY_SIGNAL_KIND_DIRECTIVE = 3;
  TELEMETRY_SIGNAL_KIND_STORAGE = 4;
  TELEMETRY_SIGNAL_KIND_PROJECTION = 5;
}

enum TelemetryOutcome {
  TELEMETRY_OUTCOME_UNSPECIFIED = 0;
  TELEMETRY_OUTCOME_OK = 1;
  TELEMETRY_OUTCOME_ERROR = 2;
  TELEMETRY_OUTCOME_REFUSED = 3;
  TELEMETRY_OUTCOME_DEGRADED = 4;
}

// A small typed measurement accompanying an observation. The server enforces
// bounded count, name length, and finite values; this protocol never accepts
// terminal output, arbitrary blobs, or untyped log payloads as telemetry.
message TelemetryMeasurement {
  string name = 1;
  double value = 2;
}

// The enrolled node identity comes from `authentication.node_id`; an optional
// agent session distinguishes multiple supervisors behind that node.
message RecordTelemetryRequest {
  string tenant_id = 1;
  string repository_id = 2;
  string agent_session_id = 3;
  TelemetrySignalKind kind = 4;
  string name = 5;
  TelemetryOutcome outcome = 6;
  uint64 duration_ms = 7;
  string occurred_at = 8;
  repeated TelemetryMeasurement measurements = 9;
  TelemetryAuthentication authentication = 10;
}

message TelemetryRecord {
  string telemetry_id = 1;
  string tenant_id = 2;
  string repository_id = 3;
  string node_id = 4;
  string agent_session_id = 5;
  TelemetrySignalKind kind = 6;
  string name = 7;
  TelemetryOutcome outcome = 8;
  uint64 duration_ms = 9;
  string occurred_at = 10;
  string recorded_at = 11;
}

// Zero-valued kind and an empty name mean "all kinds" and "all names". The
// server bounds the selected time range and point count before returning data.
message TelemetryReadRequest {
  string tenant_id = 1;
  string repository_id = 2;
  TelemetrySignalKind kind = 3;
  string name = 4;
  uint32 bucket_seconds = 5;
  uint32 max_points = 6;
  TelemetryAuthentication authentication = 7;
}

message TelemetryMetric {
  TelemetrySignalKind kind = 1;
  string name = 2;
  uint64 calls = 3;
  uint64 errors = 4;
  bool currently_failing = 5;
  string last_success_at = 6;
  string last_error_at = 7;
  double average_duration_ms = 8;
}

message TelemetryPoint {
  string bucket_start_at = 1;
  uint64 calls = 2;
  uint64 errors = 3;
  double average_duration_ms = 4;
}

message TelemetrySeries {
  TelemetrySignalKind kind = 1;
  string name = 2;
  repeated TelemetryPoint points = 3;
}

message TelemetrySnapshot {
  repeated TelemetryMetric metrics = 1;
  repeated TelemetrySeries series = 2;
  string observed_at = 3;
}

message ClaimLeaseRequest {
  string tenant_id = 1;
  string repository_id = 2;
  string task_id = 3;
  string owner_id = 4;
  string branch = 5;
  uint64 lease_seconds = 6;
  repeated string paths = 7;
  repeated string symbols = 8;
  ClaimAuthentication authentication = 9;
}

message ClaimLeaseResult {
  ClaimLeaseOutcome outcome = 1;
  string owner_id = 2;
  string branch = 3;
  string claim_started_at = 4;
  string lease_expires_at = 5;
  uint64 claim_lapses = 6;
  repeated string paths = 7;
  repeated string symbols = 8;
  string diagnostic = 9;
}

message ClaimReleaseRequest {
  string tenant_id = 1;
  string repository_id = 2;
  string task_id = 3;
  string owner_id = 4;
  ClaimAuthentication authentication = 5;
}

message ClaimReleaseResult {
  bool released = 1;
  string diagnostic = 2;
}

message ClaimRenewRequest {
  string tenant_id = 1;
  string repository_id = 2;
  string task_id = 3;
  string owner_id = 4;
  uint64 lease_seconds = 5;
  ClaimAuthentication authentication = 6;
}

message ClaimRecoverRequest {
  string tenant_id = 1;
  string repository_id = 2;
  string task_id = 3;
  string expected_owner = 4;
  string owner_id = 5;
  string reason = 6;
  string branch = 7;
  uint64 lease_seconds = 8;
  repeated string paths = 9;
  repeated string symbols = 10;
  ClaimAuthentication authentication = 11;
}

// ADR-0096 clause 5: for a federated repository, overlap detection reads
// Ackplane's claim registry instead of the local task table.
message ActiveClaimsRequest {
  string tenant_id = 1;
  string repository_id = 2;
}

message ActiveClaimSummary {
  string task_id = 1;
  string owner_id = 2;
  string branch = 3;
  string lease_expires_at = 4;
  repeated string paths = 5;
  repeated string symbols = 6;
}

message ActiveClaimsResult {
  repeated ActiveClaimSummary claims = 1;
}

// The embedding field is omitted (not zero-length) when the caller has no
// embedder configured: knowledge without one still records and recalls by
// recency, matching the local planes' own graceful degradation (ADR-0080).
message RecordKnowledgeRequest {
  string tenant_id = 1;
  string repository_id = 2;
  string content = 3;
  string source_ref = 4;
  double half_life_hours = 5;
  string embedding_model = 6;
  repeated float embedding = 7;
  KnowledgeAuthentication authentication = 8;
  repeated string reach_node_ids = 9;
  string reach_goal_id = 10;
}

message KnowledgeRecord {
  string knowledge_id = 1;
  string tenant_id = 2;
  string repository_id = 3;
  string content = 4;
  string source_ref = 5;
  double half_life_hours = 6;
  string confirmed_at = 7;
  string recorded_by = 8;
  repeated string reach_node_ids = 9;
  string reach_goal_id = 10;
}

// `query_embedding` empty means "no semantic ranking available or
// requested" -- the result still returns, ordered by recency instead of
// dropping the caller's request.
message RecallKnowledgeRequest {
  string tenant_id = 1;
  string repository_id = 2;
  string embedding_model = 3;
  repeated float query_embedding = 4;
  uint32 limit = 5;
  KnowledgeAuthentication authentication = 6;
}

message ActiveKnowledgeEntry {
  string knowledge_id = 1;
  string content = 2;
  string source_ref = 3;
  // Computed at query time from half_life_hours and confirmed_at
  // (mindleak-core::decay::effective_weight's own formula), never stored.
  double effective_weight = 4;
  string confirmed_at = 5;
  string recorded_by = 6;
  string last_reconfirmed_at = 7;
  string last_reconfirmed_by = 8;
  string last_reconfirmation_evidence_ref = 9;
  repeated string reach_node_ids = 10;
  string reach_goal_id = 11;
}

message RecallKnowledgeResult {
  repeated ActiveKnowledgeEntry entries = 1;
  // False when query_embedding was empty or named a model nothing here was
  // embedded under -- entries are still recency-ordered, not withheld.
  bool ranked_by_similarity = 2;
}

// Returns active and retired statements so an operator can inspect why a
// previously active recommendation disappeared. A zero limit selects the
// service default; the response reports the bounded effective limit.
message KnowledgeHistoryRequest {
  string tenant_id = 1;
  string repository_id = 2;
  uint32 limit = 3;
  KnowledgeAuthentication authentication = 4;
}

message KnowledgeHistoryEntry {
  string knowledge_id = 1;
  string content = 2;
  string source_ref = 3;
  string confirmed_at = 4;
  // Empty for active statements.
  string retired_at = 5;
  string retired_reason = 6;
  string retired_by = 7;
  string recorded_by = 8;
  string last_reconfirmed_at = 9;
  string last_reconfirmed_by = 10;
  string last_reconfirmation_evidence_ref = 11;
  repeated string reach_node_ids = 12;
  string reach_goal_id = 13;
}

message KnowledgeHistoryResult {
  repeated KnowledgeHistoryEntry entries = 1;
  uint32 effective_limit = 2;
}

message ReconfirmKnowledgeRequest {
  string tenant_id = 1;
  string repository_id = 2;
  string knowledge_id = 3;
  string evidence_ref = 4;
  KnowledgeAuthentication authentication = 5;
}

message ReconfirmKnowledgeResult {
  bool reconfirmed = 1;
  string reconfirmation_id = 2;
  string evidence_ref = 3;
  string reconfirmed_by = 4;
  string reconfirmed_at = 5;
}

message RetireKnowledgeRequest {
  string tenant_id = 1;
  string repository_id = 2;
  string knowledge_id = 3;
  string reason = 4;
  // Retained for wire compatibility. The service records the authenticated
  // node id as retirement provenance and never trusts this caller label.
  string retired_by = 5;
  KnowledgeAuthentication authentication = 6;
}

message RetireKnowledgeResult {
  bool retired = 1;
}

// A closed evidence vocabulary keeps the first Evidence Board contract
// inspectable without treating arbitrary user text as a type system.
enum EvidenceKind {
  EVIDENCE_KIND_UNSPECIFIED = 0;
  EVIDENCE_KIND_COMMIT = 1;
  EVIDENCE_KIND_EXECUTION = 2;
  EVIDENCE_KIND_RECEIPT = 3;
  EVIDENCE_KIND_CONFORMANCE = 4;
  EVIDENCE_KIND_REVIEW = 5;
}

// Records a bounded, provenance-bearing evidence reference for one task.
// `content_digest` is a SHA-256 digest of the referenced evidence, not the
// evidence body. `source_ref` is a bounded reference such as `commit:<sha>`
// or `receipt:<id>`, interpreted by the closed `kind` vocabulary.
message RecordEvidenceRequest {
  string tenant_id = 1;
  string repository_id = 2;
  string task_id = 3;
  EvidenceKind kind = 4;
  string source_ref = 5;
  bytes content_digest = 6;
  string observed_at = 7;
  // A node-reported session label. The signature proves only that this node
  // asserted the value; it does not prove the session exists or is owned here.
  string reported_agent_session_id = 8;
  EvidenceAuthentication authentication = 9;
  // Optional for v1 compatibility. New clients sign a caller-selected value
  // so a retry after a lost response returns the original Evidence record.
  string idempotency_key = 10;
  // The active local Constitution version the node evaluated when it recorded
  // the reference. It is node-reported and signed, not server-approved policy.
  string reported_constitution_version = 11;
}

message EvidenceRecord {
  string evidence_id = 1;
  string tenant_id = 2;
  string repository_id = 3;
  string task_id = 4;
  EvidenceKind kind = 5;
  string source_ref = 6;
  bytes content_digest = 7;
  string observed_at = 8;
  string reported_agent_session_id = 9;
  string recorded_by = 10;
  string recorded_at = 11;
  bool idempotent_replay = 12;
  string reported_constitution_version = 13;
}

// Lists task-bound evidence for one repository. A zero limit selects the
// service default; the result reports the effective bounded limit.
message ListEvidenceRequest {
  string tenant_id = 1;
  string repository_id = 2;
  string task_id = 3;
  uint32 limit = 4;
  EvidenceAuthentication authentication = 5;
  // Both page fields are empty for the first page, or both identify the last
  // returned row for stable keyset pagination ordered by server-recorded time.
  string page_before_recorded_at = 6;
  string page_before_evidence_id = 7;
}

message ListEvidenceResult {
  repeated EvidenceRecord entries = 1;
  uint32 effective_limit = 2;
  string next_recorded_at = 3;
  string next_evidence_id = 4;
}

// Mirrors Lodestar's durable verdict vocabulary. A verdict is not a generic
// success flag: drift and needs-human remain visible review states, while a
// violation remains blocked rather than being softened to pending review.
enum ConformanceVerdict {
  CONFORMANCE_VERDICT_UNSPECIFIED = 0;
  CONFORMANCE_VERDICT_ALIGNED = 1;
  CONFORMANCE_VERDICT_DRIFT = 2;
  CONFORMANCE_VERDICT_VIOLATION = 3;
  CONFORMANCE_VERDICT_NEEDS_HUMAN = 4;
}

// Derived from the initial verdict. Future reviewed human decisions are a
// separate typed action; recording a conformance result does not pretend an
// enrolled node can approve its own drift or needs-human outcome.
enum ConformanceReviewState {
  CONFORMANCE_REVIEW_STATE_UNSPECIFIED = 0;
  CONFORMANCE_REVIEW_STATE_NOT_REQUIRED = 1;
  CONFORMANCE_REVIEW_STATE_PENDING = 2;
  CONFORMANCE_REVIEW_STATE_BLOCKED = 3;
}

// A closed, body-free summary of why a conformance outcome needs attention.
// The full private finding set remains represented by finding_count and
// findings_digest; these codes let Bridge explain a result without carrying
// arbitrary terminal output, source excerpts, or unbounded free-form text.
enum ConformanceFindingCode {
  CONFORMANCE_FINDING_CODE_UNSPECIFIED = 0;
  CONFORMANCE_FINDING_CODE_EVIDENCE_MISSING = 1;
  CONFORMANCE_FINDING_CODE_EVIDENCE_STALE = 2;
  CONFORMANCE_FINDING_CODE_SCOPE_UNCOVERED = 3;
  CONFORMANCE_FINDING_CODE_POLICY_DRIFT = 4;
  CONFORMANCE_FINDING_CODE_POLICY_VIOLATION = 5;
  CONFORMANCE_FINDING_CODE_RECEIPT_MISSING = 6;
  CONFORMANCE_FINDING_CODE_HUMAN_REVIEW_REQUIRED = 7;
}

// Records one node-reported conformance outcome for an existing Evidence
// record. The server verifies that the reporting node created that evidence;
// human acceptance and override remain separate reviewed actions. Findings
// stay at their source; this carries only a count and SHA-256 digest.
message RecordConformanceRequest {
  string tenant_id = 1;
  string repository_id = 2;
  string task_id = 3;
  string evidence_id = 4;
  ConformanceVerdict verdict = 5;
  uint32 finding_count = 6;
  bytes findings_digest = 7;
  // Node-reported check time. The server orders history by recorded_at, so
  // this value cannot promote a future-dated result over a later record.
  string reported_checked_at = 8;
  EvidenceAuthentication authentication = 9;
  // Signed caller-selected identity used to make retrying a lost response
  // safe. Reuse with different logical fields is refused.
  string idempotency_key = 10;
  // The active local Constitution version the evaluator checked. This remains
  // a signed node assertion; human review and policy approval are separate.
  string reported_constitution_version = 11;
  // Bounded closed-code summaries. They are signed with the result and never
  // carry the private free-form finding bodies represented by findings_digest.
  repeated ConformanceFindingCode finding_codes = 12;
}

message ConformanceRecord {
  string conformance_id = 1;
  string tenant_id = 2;
  string repository_id = 3;
  string task_id = 4;
  string evidence_id = 5;
  ConformanceVerdict verdict = 6;
  uint32 finding_count = 7;
  bytes findings_digest = 8;
  ConformanceReviewState review_state = 9;
  string reported_checked_at = 10;
  string evaluated_by = 11;
  string recorded_at = 12;
  string idempotency_key = 13;
  bool idempotent_replay = 14;
  string reported_constitution_version = 15;
  repeated ConformanceFindingCode finding_codes = 16;
}

message ListConformanceRequest {
  string tenant_id = 1;
  string repository_id = 2;
  string task_id = 3;
  uint32 limit = 4;
  EvidenceAuthentication authentication = 5;
  string page_before_recorded_at = 6;
  string page_before_conformance_id = 7;
}

message ListConformanceResult {
  repeated ConformanceRecord entries = 1;
  uint32 effective_limit = 2;
  string next_recorded_at = 3;
  string next_conformance_id = 4;
}

// The enrolled node's proof for a ConstitutionService request. A distinct
// message, domain, and nonce space from KnowledgeAuthentication: a
// constitution snapshot has no equivalent of a knowledge statement's fields,
// so binding those here would sign nothing meaningful, and sharing a nonce
// table would couple two unrelated domains' replay protection.
message ConstitutionAuthentication {
  string signing_key_id = 1;
  string node_id = 2;
  string signed_at = 3;
  bytes nonce = 4;
  bytes signature = 5;
}

// One clause, mirroring lodestar-core::model::constitution::Goal's
// externally-relevant fields -- a read-only projection carries what a viewer
// needs to understand a clause, not the full internal record (parent_id,
// superseded_by, waiver bookkeeping, import provenance stay local).
message ConstitutionClause {
  string id = 1;
  string slug = 2;
  string kind = 3;
  string title = 4;
  string statement = 5;
  string status = 6;
  string consequence = 7;
  string scope = 8;
  string rationale = 9;
}

message PublishConstitutionSnapshotRequest {
  string tenant_id = 1;
  string repository_id = 2;
  string version_id = 3;
  uint32 version = 4;
  string status = 5;
  repeated ConstitutionClause clauses = 6;
  ConstitutionAuthentication authentication = 7;
}

message PublishConstitutionSnapshotResult {
  bool published = 1;
}

message GetActiveConstitutionRequest {
  string tenant_id = 1;
  string repository_id = 2;
  ConstitutionAuthentication authentication = 3;
}

message GetActiveConstitutionResult {
  bool found = 1;
  string version_id = 2;
  uint32 version = 3;
  string status = 4;
  repeated ConstitutionClause clauses = 5;
  string published_at = 6;
}

enum ClaimLeaseOutcome {
  CLAIM_LEASE_OUTCOME_UNSPECIFIED = 0;
  CLAIM_LEASE_OUTCOME_GRANTED = 1;
  CLAIM_LEASE_OUTCOME_REJECTED = 2;
}

// ADR-0116: these are bounded facts a supervisor publishes only after the
// NodeSync connection challenge established its enrolled node identity. They
// do not carry directives, local commands, source material, or opaque payloads.
enum SupervisorDirectiveCapability {
  SUPERVISOR_DIRECTIVE_CAPABILITY_UNSPECIFIED = 0;
  SUPERVISOR_DIRECTIVE_CAPABILITY_NOTIFY = 1;
  SUPERVISOR_DIRECTIVE_CAPABILITY_PROMPT = 2;
  SUPERVISOR_DIRECTIVE_CAPABILITY_ASSIGN = 3;
  SUPERVISOR_DIRECTIVE_CAPABILITY_STEER = 4;
  SUPERVISOR_DIRECTIVE_CAPABILITY_PAUSE = 5;
  SUPERVISOR_DIRECTIVE_CAPABILITY_RESUME = 6;
  SUPERVISOR_DIRECTIVE_CAPABILITY_DRAIN = 7;
  SUPERVISOR_DIRECTIVE_CAPABILITY_TERMINATE_GRACEFULLY = 8;
  SUPERVISOR_DIRECTIVE_CAPABILITY_TERMINATE_FORCE = 9;
}

enum SupervisorOutboxDurability {
  SUPERVISOR_OUTBOX_DURABILITY_UNSPECIFIED = 0;
  SUPERVISOR_OUTBOX_DURABILITY_PERSISTENT = 1;
  SUPERVISOR_OUTBOX_DURABILITY_EPHEMERAL = 2;
}

enum SupervisorRuntime {
  SUPERVISOR_RUNTIME_UNSPECIFIED = 0;
  SUPERVISOR_RUNTIME_LOCAL_MACHINE = 1;
  SUPERVISOR_RUNTIME_CLOUD_WORKER = 2;
  SUPERVISOR_RUNTIME_PIPELINE = 3;
  SUPERVISOR_RUNTIME_SERVICE = 4;
}

enum SupervisorWorkerState {
  SUPERVISOR_WORKER_STATE_UNSPECIFIED = 0;
  SUPERVISOR_WORKER_STATE_STARTED = 1;
  SUPERVISOR_WORKER_STATE_CHECKPOINTED = 2;
  SUPERVISOR_WORKER_STATE_PAUSED = 3;
  SUPERVISOR_WORKER_STATE_DRAINING = 4;
  SUPERVISOR_WORKER_STATE_TERMINATED = 5;
  SUPERVISOR_WORKER_STATE_FAILED = 6;
  SUPERVISOR_WORKER_STATE_DISCONNECTED = 7;
  SUPERVISOR_WORKER_STATE_RECONNECTED = 8;
  SUPERVISOR_WORKER_STATE_COMPLETED = 9;
}

enum SupervisorLifecycleReason {
  SUPERVISOR_LIFECYCLE_REASON_UNSPECIFIED = 0;
  SUPERVISOR_LIFECYCLE_REASON_CAPABILITY_MISSING = 1;
  SUPERVISOR_LIFECYCLE_REASON_CHECKPOINT_FAILED = 2;
  SUPERVISOR_LIFECYCLE_REASON_DIRECTIVE_EXPIRED = 3;
  SUPERVISOR_LIFECYCLE_REASON_OUTBOX_UNAVAILABLE = 4;
  SUPERVISOR_LIFECYCLE_REASON_PROTOCOL_UNSUPPORTED = 5;
  SUPERVISOR_LIFECYCLE_REASON_SUPERVISOR_FAILED = 6;
  SUPERVISOR_LIFECYCLE_REASON_WORKER_LOST = 7;
}

message SupervisorRegistration {
  string supervisor_id = 1;
  // Must equal the authenticated NodeSync producer identity.
  string node_id = 2;
  string supervisor_version = 3;
  string protocol_version = 4;
  repeated SupervisorDirectiveCapability supported_directives = 5;
  bool supports_checkpoint = 6;
  bool supports_force_termination = 7;
  SupervisorOutboxDurability outbox_durability = 8;
  bool recoverable_outbox = 9;
}

message SupervisorHeartbeat {
  string supervisor_id = 1;
}

message SupervisorSession {
  string supervisor_id = 1;
  string session_id = 2;
  string worker_id = 3;
  SupervisorRuntime runtime = 4;
  string started_at = 5;
  SupervisorWorkerState state = 6;
}

message SupervisorLifecycleReceipt {
  string supervisor_id = 1;
  string session_id = 2;
  string worker_id = 3;
  string occurred_at = 4;
  SupervisorWorkerState state = 5;
  SupervisorLifecycleReason reason = 6;
  string idempotency_key = 7;
}

enum SupervisorFrameOperation {
  SUPERVISOR_FRAME_OPERATION_UNSPECIFIED = 0;
  SUPERVISOR_FRAME_OPERATION_REGISTRATION = 1;
  SUPERVISOR_FRAME_OPERATION_HEARTBEAT = 2;
  SUPERVISOR_FRAME_OPERATION_SESSION = 3;
  SUPERVISOR_FRAME_OPERATION_LIFECYCLE = 4;
}

// Acknowledges the durable outcome of one typed supervisor fact. It does not
// imply that a directive was delivered or a worker performed arbitrary work.
message SupervisorFrameReceipt {
  SupervisorFrameOperation operation = 1;
  string supervisor_id = 2;
  string session_id = 3;
  bool idempotent_replay = 4;
  bool projection_advanced = 5;
}

message NodeFrame {
  oneof frame {
    Hello hello = 1;
    EventBatch event_batch = 2;
    Heartbeat heartbeat = 3;
    ChallengeResponse challenge_response = 4;
    DirectiveReceipt directive_receipt = 5;
    SupervisorRegistration supervisor_registration = 6;
    SupervisorHeartbeat supervisor_heartbeat = 7;
    SupervisorSession supervisor_session = 8;
    SupervisorLifecycleReceipt supervisor_lifecycle_receipt = 9;
  }
}

message AckplaneFrame {
  oneof frame {
    HelloAccepted hello_accepted = 1;
    BatchReceipt batch_receipt = 2;
    Rejection rejection = 3;
    FlowControl flow_control = 4;
    Notice notice = 5;
    ConnectionChallenge connection_challenge = 6;
    AgentDirective agent_directive = 7;
    SupervisorFrameReceipt supervisor_frame_receipt = 8;
  }
}

// One immutable, authorized instruction for an enrolled agent supervisor
// (ADR-0107). The metadata is common to every directive; the oneof keeps the
// action vocabulary closed and prevents this stream becoming a generic command
// transport.
message AgentDirective {
  string directive_id = 1;
  string tenant_id = 2;
  string project_id = 3;
  string repository_id = 4;
  string target_node_id = 5;
  string target_agent_session_id = 6;
  DirectiveKind kind = 7;
  string schema_version = 8;
  string issuing_principal_id = 9;
  string rationale = 10;
  string task_id = 11;
  string goal_id = 12;
  string context_packet_id = 13;
  string created_at = 14;
  string expires_at = 15;
  uint64 sequence = 16;
  string idempotency_key = 17;
  bytes payload_digest = 18;
  string required_capability = 19;
  repeated string policy_refs = 20;
  repeated string knowledge_refs = 21;
  repeated string evidence_refs = 22;

  oneof payload {
    NotifyDirective notify = 30;
    PromptDirective prompt = 31;
    AssignDirective assign = 32;
    SteerDirective steer = 33;
    PauseDirective pause = 34;
    ResumeDirective resume = 35;
    DrainDirective drain = 36;
    TerminateDirective terminate = 37;
  }
}

enum DirectiveKind {
  DIRECTIVE_KIND_UNSPECIFIED = 0;
  DIRECTIVE_KIND_NOTIFY = 1;
  DIRECTIVE_KIND_PROMPT = 2;
  DIRECTIVE_KIND_ASSIGN = 3;
  DIRECTIVE_KIND_STEER = 4;
  DIRECTIVE_KIND_PAUSE = 5;
  DIRECTIVE_KIND_RESUME = 6;
  DIRECTIVE_KIND_DRAIN = 7;
  DIRECTIVE_KIND_TERMINATE = 8;
}

message NotifyDirective {
  string message = 1;
}

message PromptDirective {
  string instruction = 1;
}

message AssignDirective {}

message SteerDirective {
  string instruction = 1;
  bool checkpoint_required = 2;
}

message PauseDirective {
  bool checkpoint_required = 1;
}

message ResumeDirective {}

message DrainDirective {
  string deadline = 1;
}

message TerminateDirective {
  TerminationMode mode = 1;
  string graceful_deadline = 2;
}

enum TerminationMode {
  TERMINATION_MODE_UNSPECIFIED = 0;
  TERMINATION_MODE_GRACEFUL = 1;
  TERMINATION_MODE_FORCE_AFTER_DEADLINE = 2;
  TERMINATION_MODE_FORCE = 3;
}

// Acknowledges what the enrolled supervisor did, not merely that Ackplane put
// a directive on the stream. The original payload digest binds the receipt to
// the exact immutable directive that was evaluated.
message DirectiveReceipt {
  string directive_id = 1;
  string tenant_id = 2;
  string project_id = 3;
  string repository_id = 4;
  string node_id = 5;
  string agent_session_id = 6;
  DirectiveReceiptStatus status = 7;
  DirectiveReceiptReason reason = 8;
  string occurred_at = 9;
  bytes payload_digest = 10;
  repeated string checkpoint_refs = 11;
  repeated string evidence_refs = 12;
  uint64 directive_sequence = 13;
  string diagnostic = 14;
}

enum DirectiveReceiptStatus {
  DIRECTIVE_RECEIPT_STATUS_UNSPECIFIED = 0;
  DIRECTIVE_RECEIPT_STATUS_ACCEPTED = 1;
  DIRECTIVE_RECEIPT_STATUS_REFUSED = 2;
  DIRECTIVE_RECEIPT_STATUS_APPLIED = 3;
  DIRECTIVE_RECEIPT_STATUS_FAILED = 4;
  DIRECTIVE_RECEIPT_STATUS_EXPIRED = 5;
}

enum DirectiveReceiptReason {
  DIRECTIVE_RECEIPT_REASON_UNSPECIFIED = 0;
  DIRECTIVE_RECEIPT_REASON_NONE = 1;
  DIRECTIVE_RECEIPT_REASON_EXPIRED = 2;
  DIRECTIVE_RECEIPT_REASON_UNSUPPORTED_KIND = 3;
  DIRECTIVE_RECEIPT_REASON_UNSUPPORTED_VERSION = 4;
  DIRECTIVE_RECEIPT_REASON_CAPABILITY_MISSING = 5;
  DIRECTIVE_RECEIPT_REASON_UNAUTHORIZED = 6;
  DIRECTIVE_RECEIPT_REASON_INVALID_STATE = 7;
  DIRECTIVE_RECEIPT_REASON_CHECKPOINT_FAILED = 8;
  DIRECTIVE_RECEIPT_REASON_SUPERVISOR_FAILED = 9;
  DIRECTIVE_RECEIPT_REASON_PAYLOAD_DIGEST_MISMATCH = 10;
}

message Hello {
  string tenant_id = 1;
  string repository_id = 2;
  string producer_id = 3;
  uint64 last_accepted_position = 4;
  repeated string capabilities = 5;
  // Which enrolled key this node will use to answer the connection
  // challenge (ADR-0098 decision 1). Required: a Hello without one cannot be
  // challenged against any key and is refused.
  string signing_key_id = 6;
}

// Issued once, immediately after a Hello that names a signing key, and never
// reused: it authenticates this one live connection, not an envelope or an
// enrolment (ADR-0098 decision 1's domain separation from ADR-0085's
// activation nonce).
message ConnectionChallenge {
  bytes nonce = 1;
}

// The node's proof of possession of the key it named in Hello, over this
// connection's nonce.
message ChallengeResponse {
  bytes signature = 1;
}

message EnrollmentRequest {
  string request_id = 1;
  string tenant_id = 2;
  string repository_id = 3;
  string proposed_node_id = 4;
  string display_name = 5;
  string public_key_fingerprint = 6;
  repeated string requested_capabilities = 7;
  string created_at = 8;
  string expires_at = 9;
  // The key itself, not its hash: nothing can verify a signature from a
  // fingerprint alone. The fingerprint stays, because decision 4 has an
  // administrator approve THAT, and a person can compare a short fingerprint on
  // two screens where they cannot compare a key.
  //
  // Enrolment is the only message that carries it. Activation deliberately does
  // not: approval binds to the fingerprint, so a proof allowed to re-send a key
  // could present a different one after approval and be verified against it,
  // which would make the approval meaningless. Ackplane keeps what was approved
  // and verifies against that.
  bytes public_key = 10;
}

message EnrollmentRequestStatus {
  string request_id = 1;
  EnrollmentState state = 2;
  EnrollmentRejectionReason rejection_reason = 3;
  string diagnostic = 4;
}

message EnrollmentChallengeRequest {
  string request_id = 1;
  string tenant_id = 2;
  string repository_id = 3;
  string proposed_node_id = 4;
  string public_key_fingerprint = 5;
}

message EnrollmentChallenge {
  string request_id = 1;
  string tenant_id = 2;
  string repository_id = 3;
  string proposed_node_id = 4;
  string public_key_fingerprint = 5;
  bytes nonce = 6;
  string issued_at = 7;
  string expires_at = 8;
  EnrollmentState state = 9;
}

message EnrollmentActivationProof {
  string request_id = 1;
  string tenant_id = 2;
  string repository_id = 3;
  string proposed_node_id = 4;
  string public_key_fingerprint = 5;
  bytes nonce = 6;
  bytes signature = 7;
}

message EnrollmentActivationResult {
  string request_id = 1;
  EnrollmentState state = 2;
  string enrolment_receipt_id = 3;
  EnrollmentRejectionReason rejection_reason = 4;
  string diagnostic = 5;
  string signing_key_id = 6;
}

message KeyRotationRequest {
  string tenant_id = 1;
  string repository_id = 2;
  string node_id = 3;
  string current_key_id = 4;
  string successor_key_id = 5;
  string successor_public_key_fingerprint = 6;
  bytes successor_public_key = 7;
  bytes current_key_signature = 8;
  bytes successor_key_signature = 9;
  uint64 requested_overlap_seconds = 10;
}

message KeyRotationResult {
  string node_id = 1;
  string current_key_id = 2;
  string successor_key_id = 3;
  KeyRotationOutcome outcome = 4;
  KeyRotationRejectionReason rejection_reason = 5;
  string diagnostic = 6;
}

enum KeyRotationOutcome {
  KEY_ROTATION_OUTCOME_UNSPECIFIED = 0;
  KEY_ROTATION_OUTCOME_APPLIED = 1;
  KEY_ROTATION_OUTCOME_REJECTED = 2;
}

enum KeyRotationRejectionReason {
  KEY_ROTATION_REJECTION_REASON_UNSPECIFIED = 0;
  KEY_ROTATION_REJECTION_REASON_CURRENT_KEY_NOT_ACTIVE = 1;
  KEY_ROTATION_REJECTION_REASON_SUCCESSOR_KEY_CONFLICT = 2;
  KEY_ROTATION_REJECTION_REASON_CONTINUITY_PROOF_INVALID = 3;
  KEY_ROTATION_REJECTION_REASON_NODE_REVOKED = 4;
}

enum EnrollmentState {
  ENROLLMENT_STATE_UNSPECIFIED = 0;
  ENROLLMENT_STATE_PENDING = 1;
  ENROLLMENT_STATE_APPROVED = 2;
  ENROLLMENT_STATE_ACTIVATING = 3;
  ENROLLMENT_STATE_ACTIVE = 4;
  ENROLLMENT_STATE_EXPIRED = 5;
  ENROLLMENT_STATE_REJECTED = 6;
  ENROLLMENT_STATE_REVOKED = 7;
}

enum EnrollmentRejectionReason {
  ENROLLMENT_REJECTION_REASON_UNSPECIFIED = 0;
  ENROLLMENT_REJECTION_REASON_REQUEST_EXPIRED = 1;
  ENROLLMENT_REJECTION_REASON_REQUEST_REJECTED = 2;
  ENROLLMENT_REJECTION_REASON_NODE_REVOKED = 3;
  ENROLLMENT_REJECTION_REASON_BINDING_MISMATCH = 4;
  ENROLLMENT_REJECTION_REASON_CHALLENGE_EXPIRED = 5;
  ENROLLMENT_REJECTION_REASON_CHALLENGE_ALREADY_USED = 6;
}

// The candidate's proof of possession of the exact key it asks about
// (ADR-0122). Keyed on `key_fingerprint`, not `signing_key_id`: a node that
// has never submitted an enrollment request has no server-assigned key id
// yet, only the fingerprint of the Ed25519 key it generated locally.
message EnrollmentStatusAuthentication {
  string node_id = 1;
  string key_fingerprint = 2;
  string signed_at = 3;
  bytes nonce = 4;
  bytes signature = 5;
}

// Names the exact candidate binding being asked about, not a repository: a
// bare repository-level query would let any caller who can reach the port
// learn whether a tenant's repository has ever been enrolled by anyone.
message EnrollmentStatusRequest {
  string tenant_id = 1;
  string repository_id = 2;
  string candidate_node_id = 3;
  string candidate_key_fingerprint = 4;
  EnrollmentStatusAuthentication authentication = 5;
}

// `verified: false` means the caller did not prove possession of the exact
// (tenant_id, repository_id, candidate_node_id, candidate_key_fingerprint)
// binding it asked about -- an absent binding, a mismatched key, a stale
// timestamp, a replayed nonce, and a forged signature all produce this
// identical result, so a caller who is not the exact node it asked about
// learns nothing (ADR-0122 decision 5). `state` is meaningful only when
// `verified` is true; a revoked node's key still lets it learn it is
// revoked (decision 6), since this RPC grants no new authority.
message EnrollmentStatusResult {
  bool verified = 1;
  EnrollmentState state = 2;
}

message HelloAccepted {
  uint64 accepted_position = 1;
  repeated string enabled_capabilities = 2;
}

message EventBatch {
  repeated EventEnvelope events = 1;
}

message EventEnvelope {
  string tenant_id = 1;
  string repository_id = 2;
  string producer_id = 3;
  uint64 producer_sequence = 4;
  bytes payload = 5;
  bytes payload_digest = 6;
  string schema_version = 7;
  string occurred_at = 8;
  string payload_type = 9;
  bytes previous_envelope_digest = 10;
  string signing_key_id = 11;
  bytes signature = 12;
  ProvenanceClass provenance = 13;
}

enum ProvenanceClass {
  PROVENANCE_CLASS_UNSPECIFIED = 0;
  PROVENANCE_CLASS_UNVERIFIED_ATTRIBUTION = 1;
  PROVENANCE_CLASS_ENROLLED_NODE = 2;
  PROVENANCE_CLASS_AUTHENTICATED_PRINCIPAL = 3;
  PROVENANCE_CLASS_PROVIDER_ATTESTED = 4;
}

message Heartbeat {
  uint64 last_accepted_position = 1;
}

message BatchReceipt {
  repeated RecordReceipt receipts = 1;
}

message RecordReceipt {
  string record_id = 1;
  uint64 position = 2;
  ReceiptDisposition disposition = 3;
}

enum ReceiptDisposition {
  RECEIPT_DISPOSITION_UNSPECIFIED = 0;
  RECEIPT_DISPOSITION_ACCEPTED = 1;
  RECEIPT_DISPOSITION_DUPLICATE = 2;
}

message Rejection {
  string record_id = 1;
  RejectionReason reason = 2;
  bool retryable = 3;
  string diagnostic = 4;
}

enum RejectionReason {
  REJECTION_REASON_UNSPECIFIED = 0;
  REJECTION_REASON_MALFORMED = 1;
  REJECTION_REASON_UNAUTHENTICATED = 2;
  REJECTION_REASON_UNAUTHORIZED = 3;
  REJECTION_REASON_SEQUENCE_CONFLICT = 4;
  REJECTION_REASON_UNSUPPORTED_VERSION = 5;
  REJECTION_REASON_UNAVAILABLE = 6;
  // Distinct from UNAUTHENTICATED: an administrator or incident workflow
  // revoked this key (ADR-0085 decision 8), rather than the key simply not
  // yet being active, expired, or retired by ordinary rotation.
  REJECTION_REASON_NODE_REVOKED = 7;
}

message FlowControl {
  uint32 max_in_flight_batches = 1;
  uint32 max_batch_bytes = 2;
}

message Notice {
  string code = 1;
  string message = 2;
  string schema_version = 3;
}
