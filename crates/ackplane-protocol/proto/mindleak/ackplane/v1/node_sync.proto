syntax = "proto3";

package mindleak.ackplane.v1;

service NodeSyncService {
  rpc Synchronize(stream NodeFrame) returns (stream AckplaneFrame);
}

service NodeEnrollmentService {
  rpc SubmitEnrollmentRequest(EnrollmentRequest) returns (EnrollmentRequestStatus);
  rpc GetActivationChallenge(EnrollmentChallengeRequest) returns (EnrollmentChallenge);
  rpc ActivateEnrollment(EnrollmentActivationProof) returns (EnrollmentActivationResult);
  rpc RotateNodeKey(KeyRotationRequest) returns (KeyRotationResult);
}

service ClaimDelegationService {
  rpc DelegateClaim(ClaimLeaseRequest) returns (ClaimLeaseResult);
  rpc ReleaseClaim(ClaimReleaseRequest) returns (ClaimReleaseResult);
  rpc RenewClaim(ClaimRenewRequest) returns (ClaimLeaseResult);
  rpc RecoverClaim(ClaimRecoverRequest) returns (ClaimLeaseResult);
  rpc ListActiveClaims(ActiveClaimsRequest) returns (ActiveClaimsResult);
}

// ADR-0106 decision 3: knowledge is one of the PostgreSQL-backed Industrial
// domains -- first slice: record, recall (ranked by pgvector similarity
// search when a query embedding is supplied, else by recency), and retire.
service KnowledgeService {
  rpc RecordKnowledge(RecordKnowledgeRequest) returns (KnowledgeRecord);
  rpc RecallKnowledge(RecallKnowledgeRequest) returns (RecallKnowledgeResult);
  rpc RetireKnowledge(RetireKnowledgeRequest) returns (RetireKnowledgeResult);
}

// The enrolled node's proof that it, not just its bearer credentials, is
// asking for this claim (ADR-0096 clause 4's authentication gap). Reuses the
// same Ed25519 signing key and domain-separated verification
// `signing_keys::resolve` already provides for envelopes and connections
// (ADR-0084, ADR-0098) -- not a new trust scheme.
message ClaimAuthentication {
  string signing_key_id = 1;
  string node_id = 2;
  string signed_at = 3;
  bytes nonce = 4;
  bytes signature = 5;
}

message ClaimLeaseRequest {
  string tenant_id = 1;
  string repository_id = 2;
  string task_id = 3;
  string owner_id = 4;
  string branch = 5;
  uint64 lease_seconds = 6;
  repeated string paths = 7;
  repeated string symbols = 8;
  ClaimAuthentication authentication = 9;
}

message ClaimLeaseResult {
  ClaimLeaseOutcome outcome = 1;
  string owner_id = 2;
  string branch = 3;
  string claim_started_at = 4;
  string lease_expires_at = 5;
  uint64 claim_lapses = 6;
  repeated string paths = 7;
  repeated string symbols = 8;
  string diagnostic = 9;
}

message ClaimReleaseRequest {
  string tenant_id = 1;
  string repository_id = 2;
  string task_id = 3;
  string owner_id = 4;
  ClaimAuthentication authentication = 5;
}

message ClaimReleaseResult {
  bool released = 1;
  string diagnostic = 2;
}

message ClaimRenewRequest {
  string tenant_id = 1;
  string repository_id = 2;
  string task_id = 3;
  string owner_id = 4;
  uint64 lease_seconds = 5;
  ClaimAuthentication authentication = 6;
}

message ClaimRecoverRequest {
  string tenant_id = 1;
  string repository_id = 2;
  string task_id = 3;
  string expected_owner = 4;
  string owner_id = 5;
  string reason = 6;
  string branch = 7;
  uint64 lease_seconds = 8;
  repeated string paths = 9;
  repeated string symbols = 10;
  ClaimAuthentication authentication = 11;
}

// ADR-0096 clause 5: for a federated repository, overlap detection reads
// Ackplane's claim registry instead of the local task table.
message ActiveClaimsRequest {
  string tenant_id = 1;
  string repository_id = 2;
}

message ActiveClaimSummary {
  string task_id = 1;
  string owner_id = 2;
  string branch = 3;
  string lease_expires_at = 4;
  repeated string paths = 5;
  repeated string symbols = 6;
}

message ActiveClaimsResult {
  repeated ActiveClaimSummary claims = 1;
}

// The embedding field is omitted (not zero-length) when the caller has no
// embedder configured: knowledge without one still records and recalls by
// recency, matching the local planes' own graceful degradation (ADR-0080).
message RecordKnowledgeRequest {
  string tenant_id = 1;
  string repository_id = 2;
  string content = 3;
  string source_ref = 4;
  double half_life_hours = 5;
  string embedding_model = 6;
  repeated float embedding = 7;
}

message KnowledgeRecord {
  string knowledge_id = 1;
  string tenant_id = 2;
  string repository_id = 3;
  string content = 4;
  string source_ref = 5;
  double half_life_hours = 6;
  string confirmed_at = 7;
}

// `query_embedding` empty means "no semantic ranking available or
// requested" -- the result still returns, ordered by recency instead of
// dropping the caller's request.
message RecallKnowledgeRequest {
  string tenant_id = 1;
  string repository_id = 2;
  string embedding_model = 3;
  repeated float query_embedding = 4;
  uint32 limit = 5;
}

message ActiveKnowledgeEntry {
  string knowledge_id = 1;
  string content = 2;
  string source_ref = 3;
  // Computed at query time from half_life_hours and confirmed_at
  // (mindleak-core::decay::effective_weight's own formula), never stored.
  double effective_weight = 4;
  string confirmed_at = 5;
}

message RecallKnowledgeResult {
  repeated ActiveKnowledgeEntry entries = 1;
  // False when query_embedding was empty or named a model nothing here was
  // embedded under -- entries are still recency-ordered, not withheld.
  bool ranked_by_similarity = 2;
}

message RetireKnowledgeRequest {
  string tenant_id = 1;
  string repository_id = 2;
  string knowledge_id = 3;
  string reason = 4;
  string retired_by = 5;
}

message RetireKnowledgeResult {
  bool retired = 1;
}

enum ClaimLeaseOutcome {
  CLAIM_LEASE_OUTCOME_UNSPECIFIED = 0;
  CLAIM_LEASE_OUTCOME_GRANTED = 1;
  CLAIM_LEASE_OUTCOME_REJECTED = 2;
}

message NodeFrame {
  oneof frame {
    Hello hello = 1;
    EventBatch event_batch = 2;
    Heartbeat heartbeat = 3;
    ChallengeResponse challenge_response = 4;
    DirectiveReceipt directive_receipt = 5;
  }
}

message AckplaneFrame {
  oneof frame {
    HelloAccepted hello_accepted = 1;
    BatchReceipt batch_receipt = 2;
    Rejection rejection = 3;
    FlowControl flow_control = 4;
    Notice notice = 5;
    ConnectionChallenge connection_challenge = 6;
    AgentDirective agent_directive = 7;
  }
}

// One immutable, authorized instruction for an enrolled agent supervisor
// (ADR-0107). The metadata is common to every directive; the oneof keeps the
// action vocabulary closed and prevents this stream becoming a generic command
// transport.
message AgentDirective {
  string directive_id = 1;
  string tenant_id = 2;
  string project_id = 3;
  string repository_id = 4;
  string target_node_id = 5;
  string target_agent_session_id = 6;
  DirectiveKind kind = 7;
  string schema_version = 8;
  string issuing_principal_id = 9;
  string rationale = 10;
  string task_id = 11;
  string goal_id = 12;
  string context_packet_id = 13;
  string created_at = 14;
  string expires_at = 15;
  uint64 sequence = 16;
  string idempotency_key = 17;
  bytes payload_digest = 18;
  string required_capability = 19;
  repeated string policy_refs = 20;
  repeated string knowledge_refs = 21;
  repeated string evidence_refs = 22;

  oneof payload {
    NotifyDirective notify = 30;
    PromptDirective prompt = 31;
    AssignDirective assign = 32;
    SteerDirective steer = 33;
    PauseDirective pause = 34;
    ResumeDirective resume = 35;
    DrainDirective drain = 36;
    TerminateDirective terminate = 37;
  }
}

enum DirectiveKind {
  DIRECTIVE_KIND_UNSPECIFIED = 0;
  DIRECTIVE_KIND_NOTIFY = 1;
  DIRECTIVE_KIND_PROMPT = 2;
  DIRECTIVE_KIND_ASSIGN = 3;
  DIRECTIVE_KIND_STEER = 4;
  DIRECTIVE_KIND_PAUSE = 5;
  DIRECTIVE_KIND_RESUME = 6;
  DIRECTIVE_KIND_DRAIN = 7;
  DIRECTIVE_KIND_TERMINATE = 8;
}

message NotifyDirective {
  string message = 1;
}

message PromptDirective {
  string instruction = 1;
}

message AssignDirective {}

message SteerDirective {
  string instruction = 1;
  bool checkpoint_required = 2;
}

message PauseDirective {
  bool checkpoint_required = 1;
}

message ResumeDirective {}

message DrainDirective {
  string deadline = 1;
}

message TerminateDirective {
  TerminationMode mode = 1;
  string graceful_deadline = 2;
}

enum TerminationMode {
  TERMINATION_MODE_UNSPECIFIED = 0;
  TERMINATION_MODE_GRACEFUL = 1;
  TERMINATION_MODE_FORCE_AFTER_DEADLINE = 2;
  TERMINATION_MODE_FORCE = 3;
}

// Acknowledges what the enrolled supervisor did, not merely that Ackplane put
// a directive on the stream. The original payload digest binds the receipt to
// the exact immutable directive that was evaluated.
message DirectiveReceipt {
  string directive_id = 1;
  string tenant_id = 2;
  string project_id = 3;
  string repository_id = 4;
  string node_id = 5;
  string agent_session_id = 6;
  DirectiveReceiptStatus status = 7;
  DirectiveReceiptReason reason = 8;
  string occurred_at = 9;
  bytes payload_digest = 10;
  repeated string checkpoint_refs = 11;
  repeated string evidence_refs = 12;
  uint64 directive_sequence = 13;
  string diagnostic = 14;
}

enum DirectiveReceiptStatus {
  DIRECTIVE_RECEIPT_STATUS_UNSPECIFIED = 0;
  DIRECTIVE_RECEIPT_STATUS_ACCEPTED = 1;
  DIRECTIVE_RECEIPT_STATUS_REFUSED = 2;
  DIRECTIVE_RECEIPT_STATUS_APPLIED = 3;
  DIRECTIVE_RECEIPT_STATUS_FAILED = 4;
  DIRECTIVE_RECEIPT_STATUS_EXPIRED = 5;
}

enum DirectiveReceiptReason {
  DIRECTIVE_RECEIPT_REASON_UNSPECIFIED = 0;
  DIRECTIVE_RECEIPT_REASON_NONE = 1;
  DIRECTIVE_RECEIPT_REASON_EXPIRED = 2;
  DIRECTIVE_RECEIPT_REASON_UNSUPPORTED_KIND = 3;
  DIRECTIVE_RECEIPT_REASON_UNSUPPORTED_VERSION = 4;
  DIRECTIVE_RECEIPT_REASON_CAPABILITY_MISSING = 5;
  DIRECTIVE_RECEIPT_REASON_UNAUTHORIZED = 6;
  DIRECTIVE_RECEIPT_REASON_INVALID_STATE = 7;
  DIRECTIVE_RECEIPT_REASON_CHECKPOINT_FAILED = 8;
  DIRECTIVE_RECEIPT_REASON_SUPERVISOR_FAILED = 9;
  DIRECTIVE_RECEIPT_REASON_PAYLOAD_DIGEST_MISMATCH = 10;
}

message Hello {
  string tenant_id = 1;
  string repository_id = 2;
  string producer_id = 3;
  uint64 last_accepted_position = 4;
  repeated string capabilities = 5;
  // Which enrolled key this node will use to answer the connection
  // challenge (ADR-0098 decision 1). Required: a Hello without one cannot be
  // challenged against any key and is refused.
  string signing_key_id = 6;
}

// Issued once, immediately after a Hello that names a signing key, and never
// reused: it authenticates this one live connection, not an envelope or an
// enrolment (ADR-0098 decision 1's domain separation from ADR-0085's
// activation nonce).
message ConnectionChallenge {
  bytes nonce = 1;
}

// The node's proof of possession of the key it named in Hello, over this
// connection's nonce.
message ChallengeResponse {
  bytes signature = 1;
}

message EnrollmentRequest {
  string request_id = 1;
  string tenant_id = 2;
  string repository_id = 3;
  string proposed_node_id = 4;
  string display_name = 5;
  string public_key_fingerprint = 6;
  repeated string requested_capabilities = 7;
  string created_at = 8;
  string expires_at = 9;
  // The key itself, not its hash: nothing can verify a signature from a
  // fingerprint alone. The fingerprint stays, because decision 4 has an
  // administrator approve THAT, and a person can compare a short fingerprint on
  // two screens where they cannot compare a key.
  //
  // Enrolment is the only message that carries it. Activation deliberately does
  // not: approval binds to the fingerprint, so a proof allowed to re-send a key
  // could present a different one after approval and be verified against it,
  // which would make the approval meaningless. Ackplane keeps what was approved
  // and verifies against that.
  bytes public_key = 10;
}

message EnrollmentRequestStatus {
  string request_id = 1;
  EnrollmentState state = 2;
  EnrollmentRejectionReason rejection_reason = 3;
  string diagnostic = 4;
}

message EnrollmentChallengeRequest {
  string request_id = 1;
  string tenant_id = 2;
  string repository_id = 3;
  string proposed_node_id = 4;
  string public_key_fingerprint = 5;
}

message EnrollmentChallenge {
  string request_id = 1;
  string tenant_id = 2;
  string repository_id = 3;
  string proposed_node_id = 4;
  string public_key_fingerprint = 5;
  bytes nonce = 6;
  string issued_at = 7;
  string expires_at = 8;
  EnrollmentState state = 9;
}

message EnrollmentActivationProof {
  string request_id = 1;
  string tenant_id = 2;
  string repository_id = 3;
  string proposed_node_id = 4;
  string public_key_fingerprint = 5;
  bytes nonce = 6;
  bytes signature = 7;
}

message EnrollmentActivationResult {
  string request_id = 1;
  EnrollmentState state = 2;
  string enrolment_receipt_id = 3;
  EnrollmentRejectionReason rejection_reason = 4;
  string diagnostic = 5;
  string signing_key_id = 6;
}

message KeyRotationRequest {
  string tenant_id = 1;
  string repository_id = 2;
  string node_id = 3;
  string current_key_id = 4;
  string successor_key_id = 5;
  string successor_public_key_fingerprint = 6;
  bytes successor_public_key = 7;
  bytes current_key_signature = 8;
  bytes successor_key_signature = 9;
  uint64 requested_overlap_seconds = 10;
}

message KeyRotationResult {
  string node_id = 1;
  string current_key_id = 2;
  string successor_key_id = 3;
  KeyRotationOutcome outcome = 4;
  KeyRotationRejectionReason rejection_reason = 5;
  string diagnostic = 6;
}

enum KeyRotationOutcome {
  KEY_ROTATION_OUTCOME_UNSPECIFIED = 0;
  KEY_ROTATION_OUTCOME_APPLIED = 1;
  KEY_ROTATION_OUTCOME_REJECTED = 2;
}

enum KeyRotationRejectionReason {
  KEY_ROTATION_REJECTION_REASON_UNSPECIFIED = 0;
  KEY_ROTATION_REJECTION_REASON_CURRENT_KEY_NOT_ACTIVE = 1;
  KEY_ROTATION_REJECTION_REASON_SUCCESSOR_KEY_CONFLICT = 2;
  KEY_ROTATION_REJECTION_REASON_CONTINUITY_PROOF_INVALID = 3;
  KEY_ROTATION_REJECTION_REASON_NODE_REVOKED = 4;
}

enum EnrollmentState {
  ENROLLMENT_STATE_UNSPECIFIED = 0;
  ENROLLMENT_STATE_PENDING = 1;
  ENROLLMENT_STATE_APPROVED = 2;
  ENROLLMENT_STATE_ACTIVATING = 3;
  ENROLLMENT_STATE_ACTIVE = 4;
  ENROLLMENT_STATE_EXPIRED = 5;
  ENROLLMENT_STATE_REJECTED = 6;
  ENROLLMENT_STATE_REVOKED = 7;
}

enum EnrollmentRejectionReason {
  ENROLLMENT_REJECTION_REASON_UNSPECIFIED = 0;
  ENROLLMENT_REJECTION_REASON_REQUEST_EXPIRED = 1;
  ENROLLMENT_REJECTION_REASON_REQUEST_REJECTED = 2;
  ENROLLMENT_REJECTION_REASON_NODE_REVOKED = 3;
  ENROLLMENT_REJECTION_REASON_BINDING_MISMATCH = 4;
  ENROLLMENT_REJECTION_REASON_CHALLENGE_EXPIRED = 5;
  ENROLLMENT_REJECTION_REASON_CHALLENGE_ALREADY_USED = 6;
}

message HelloAccepted {
  uint64 accepted_position = 1;
  repeated string enabled_capabilities = 2;
}

message EventBatch {
  repeated EventEnvelope events = 1;
}

message EventEnvelope {
  string tenant_id = 1;
  string repository_id = 2;
  string producer_id = 3;
  uint64 producer_sequence = 4;
  bytes payload = 5;
  bytes payload_digest = 6;
  string schema_version = 7;
  string occurred_at = 8;
  string payload_type = 9;
  bytes previous_envelope_digest = 10;
  string signing_key_id = 11;
  bytes signature = 12;
  ProvenanceClass provenance = 13;
}

enum ProvenanceClass {
  PROVENANCE_CLASS_UNSPECIFIED = 0;
  PROVENANCE_CLASS_UNVERIFIED_ATTRIBUTION = 1;
  PROVENANCE_CLASS_ENROLLED_NODE = 2;
  PROVENANCE_CLASS_AUTHENTICATED_PRINCIPAL = 3;
  PROVENANCE_CLASS_PROVIDER_ATTESTED = 4;
}

message Heartbeat {
  uint64 last_accepted_position = 1;
}

message BatchReceipt {
  repeated RecordReceipt receipts = 1;
}

message RecordReceipt {
  string record_id = 1;
  uint64 position = 2;
  ReceiptDisposition disposition = 3;
}

enum ReceiptDisposition {
  RECEIPT_DISPOSITION_UNSPECIFIED = 0;
  RECEIPT_DISPOSITION_ACCEPTED = 1;
  RECEIPT_DISPOSITION_DUPLICATE = 2;
}

message Rejection {
  string record_id = 1;
  RejectionReason reason = 2;
  bool retryable = 3;
  string diagnostic = 4;
}

enum RejectionReason {
  REJECTION_REASON_UNSPECIFIED = 0;
  REJECTION_REASON_MALFORMED = 1;
  REJECTION_REASON_UNAUTHENTICATED = 2;
  REJECTION_REASON_UNAUTHORIZED = 3;
  REJECTION_REASON_SEQUENCE_CONFLICT = 4;
  REJECTION_REASON_UNSUPPORTED_VERSION = 5;
  REJECTION_REASON_UNAVAILABLE = 6;
  // Distinct from UNAUTHENTICATED: an administrator or incident workflow
  // revoked this key (ADR-0085 decision 8), rather than the key simply not
  // yet being active, expired, or retired by ordinary rotation.
  REJECTION_REASON_NODE_REVOKED = 7;
}

message FlowControl {
  uint32 max_in_flight_batches = 1;
  uint32 max_batch_bytes = 2;
}

message Notice {
  string code = 1;
  string message = 2;
  string schema_version = 3;
}
