syntax = "proto3";

package mindleak.ackplane.v1;

service NodeSyncService {
  rpc Synchronize(stream NodeFrame) returns (stream AckplaneFrame);
}

service NodeEnrollmentService {
  rpc SubmitEnrollmentRequest(EnrollmentRequest) returns (EnrollmentRequestStatus);
  rpc GetActivationChallenge(EnrollmentChallengeRequest) returns (EnrollmentChallenge);
  rpc ActivateEnrollment(EnrollmentActivationProof) returns (EnrollmentActivationResult);
  rpc RotateNodeKey(KeyRotationRequest) returns (KeyRotationResult);
}

service ClaimDelegationService {
  rpc DelegateClaim(ClaimLeaseRequest) returns (ClaimLeaseResult);
  rpc ReleaseClaim(ClaimReleaseRequest) returns (ClaimReleaseResult);
}

message ClaimLeaseRequest {
  string tenant_id = 1;
  string repository_id = 2;
  string task_id = 3;
  string owner_id = 4;
  string branch = 5;
  uint64 lease_seconds = 6;
  repeated string paths = 7;
  repeated string symbols = 8;
}

message ClaimLeaseResult {
  ClaimLeaseOutcome outcome = 1;
  string owner_id = 2;
  string branch = 3;
  string claim_started_at = 4;
  string lease_expires_at = 5;
  uint64 claim_lapses = 6;
  repeated string paths = 7;
  repeated string symbols = 8;
  string diagnostic = 9;
}

message ClaimReleaseRequest {
  string tenant_id = 1;
  string repository_id = 2;
  string task_id = 3;
  string owner_id = 4;
}

message ClaimReleaseResult {
  bool released = 1;
  string diagnostic = 2;
}

enum ClaimLeaseOutcome {
  CLAIM_LEASE_OUTCOME_UNSPECIFIED = 0;
  CLAIM_LEASE_OUTCOME_GRANTED = 1;
  CLAIM_LEASE_OUTCOME_REJECTED = 2;
}

message NodeFrame {
  oneof frame {
    Hello hello = 1;
    EventBatch event_batch = 2;
    Heartbeat heartbeat = 3;
  }
}

message AckplaneFrame {
  oneof frame {
    HelloAccepted hello_accepted = 1;
    BatchReceipt batch_receipt = 2;
    Rejection rejection = 3;
    FlowControl flow_control = 4;
    Notice notice = 5;
  }
}

message Hello {
  string tenant_id = 1;
  string repository_id = 2;
  string producer_id = 3;
  uint64 last_accepted_position = 4;
  repeated string capabilities = 5;
}

message EnrollmentRequest {
  string request_id = 1;
  string tenant_id = 2;
  string repository_id = 3;
  string proposed_node_id = 4;
  string display_name = 5;
  string public_key_fingerprint = 6;
  repeated string requested_capabilities = 7;
  string created_at = 8;
  string expires_at = 9;
  // The key itself, not its hash: nothing can verify a signature from a
  // fingerprint alone. The fingerprint stays, because decision 4 has an
  // administrator approve THAT, and a person can compare a short fingerprint on
  // two screens where they cannot compare a key.
  //
  // Enrolment is the only message that carries it. Activation deliberately does
  // not: approval binds to the fingerprint, so a proof allowed to re-send a key
  // could present a different one after approval and be verified against it,
  // which would make the approval meaningless. Ackplane keeps what was approved
  // and verifies against that.
  bytes public_key = 10;
}

message EnrollmentRequestStatus {
  string request_id = 1;
  EnrollmentState state = 2;
  EnrollmentRejectionReason rejection_reason = 3;
  string diagnostic = 4;
}

message EnrollmentChallengeRequest {
  string request_id = 1;
  string tenant_id = 2;
  string repository_id = 3;
  string proposed_node_id = 4;
  string public_key_fingerprint = 5;
}

message EnrollmentChallenge {
  string request_id = 1;
  string tenant_id = 2;
  string repository_id = 3;
  string proposed_node_id = 4;
  string public_key_fingerprint = 5;
  bytes nonce = 6;
  string issued_at = 7;
  string expires_at = 8;
  EnrollmentState state = 9;
}

message EnrollmentActivationProof {
  string request_id = 1;
  string tenant_id = 2;
  string repository_id = 3;
  string proposed_node_id = 4;
  string public_key_fingerprint = 5;
  bytes nonce = 6;
  bytes signature = 7;
}

message EnrollmentActivationResult {
  string request_id = 1;
  EnrollmentState state = 2;
  string enrolment_receipt_id = 3;
  EnrollmentRejectionReason rejection_reason = 4;
  string diagnostic = 5;
}

message KeyRotationRequest {
  string tenant_id = 1;
  string repository_id = 2;
  string node_id = 3;
  string current_key_id = 4;
  string successor_key_id = 5;
  string successor_public_key_fingerprint = 6;
  bytes successor_public_key = 7;
  bytes current_key_signature = 8;
  bytes successor_key_signature = 9;
  uint64 requested_overlap_seconds = 10;
}

message KeyRotationResult {
  string node_id = 1;
  string current_key_id = 2;
  string successor_key_id = 3;
  KeyRotationOutcome outcome = 4;
  KeyRotationRejectionReason rejection_reason = 5;
  string diagnostic = 6;
}

enum KeyRotationOutcome {
  KEY_ROTATION_OUTCOME_UNSPECIFIED = 0;
  KEY_ROTATION_OUTCOME_APPLIED = 1;
  KEY_ROTATION_OUTCOME_REJECTED = 2;
}

enum KeyRotationRejectionReason {
  KEY_ROTATION_REJECTION_REASON_UNSPECIFIED = 0;
  KEY_ROTATION_REJECTION_REASON_CURRENT_KEY_NOT_ACTIVE = 1;
  KEY_ROTATION_REJECTION_REASON_SUCCESSOR_KEY_CONFLICT = 2;
  KEY_ROTATION_REJECTION_REASON_CONTINUITY_PROOF_INVALID = 3;
  KEY_ROTATION_REJECTION_REASON_NODE_REVOKED = 4;
}

enum EnrollmentState {
  ENROLLMENT_STATE_UNSPECIFIED = 0;
  ENROLLMENT_STATE_PENDING = 1;
  ENROLLMENT_STATE_APPROVED = 2;
  ENROLLMENT_STATE_ACTIVATING = 3;
  ENROLLMENT_STATE_ACTIVE = 4;
  ENROLLMENT_STATE_EXPIRED = 5;
  ENROLLMENT_STATE_REJECTED = 6;
  ENROLLMENT_STATE_REVOKED = 7;
}

enum EnrollmentRejectionReason {
  ENROLLMENT_REJECTION_REASON_UNSPECIFIED = 0;
  ENROLLMENT_REJECTION_REASON_REQUEST_EXPIRED = 1;
  ENROLLMENT_REJECTION_REASON_REQUEST_REJECTED = 2;
  ENROLLMENT_REJECTION_REASON_NODE_REVOKED = 3;
  ENROLLMENT_REJECTION_REASON_BINDING_MISMATCH = 4;
  ENROLLMENT_REJECTION_REASON_CHALLENGE_EXPIRED = 5;
  ENROLLMENT_REJECTION_REASON_CHALLENGE_ALREADY_USED = 6;
}

message HelloAccepted {
  uint64 accepted_position = 1;
  repeated string enabled_capabilities = 2;
}

message EventBatch {
  repeated EventEnvelope events = 1;
}

message EventEnvelope {
  string tenant_id = 1;
  string repository_id = 2;
  string producer_id = 3;
  uint64 producer_sequence = 4;
  bytes payload = 5;
  bytes payload_digest = 6;
  string schema_version = 7;
  string occurred_at = 8;
  string payload_type = 9;
  bytes previous_envelope_digest = 10;
  string signing_key_id = 11;
  bytes signature = 12;
  ProvenanceClass provenance = 13;
}

enum ProvenanceClass {
  PROVENANCE_CLASS_UNSPECIFIED = 0;
  PROVENANCE_CLASS_UNVERIFIED_ATTRIBUTION = 1;
  PROVENANCE_CLASS_ENROLLED_NODE = 2;
  PROVENANCE_CLASS_AUTHENTICATED_PRINCIPAL = 3;
  PROVENANCE_CLASS_PROVIDER_ATTESTED = 4;
}

message Heartbeat {
  uint64 last_accepted_position = 1;
}

message BatchReceipt {
  repeated RecordReceipt receipts = 1;
}

message RecordReceipt {
  string record_id = 1;
  uint64 position = 2;
  ReceiptDisposition disposition = 3;
}

enum ReceiptDisposition {
  RECEIPT_DISPOSITION_UNSPECIFIED = 0;
  RECEIPT_DISPOSITION_ACCEPTED = 1;
  RECEIPT_DISPOSITION_DUPLICATE = 2;
}

message Rejection {
  string record_id = 1;
  RejectionReason reason = 2;
  bool retryable = 3;
  string diagnostic = 4;
}

enum RejectionReason {
  REJECTION_REASON_UNSPECIFIED = 0;
  REJECTION_REASON_MALFORMED = 1;
  REJECTION_REASON_UNAUTHENTICATED = 2;
  REJECTION_REASON_UNAUTHORIZED = 3;
  REJECTION_REASON_SEQUENCE_CONFLICT = 4;
  REJECTION_REASON_UNSUPPORTED_VERSION = 5;
  REJECTION_REASON_UNAVAILABLE = 6;
  // Distinct from UNAUTHENTICATED: an administrator or incident workflow
  // revoked this key (ADR-0085 decision 8), rather than the key simply not
  // yet being active, expired, or retired by ordinary rotation.
  REJECTION_REASON_NODE_REVOKED = 7;
}

message FlowControl {
  uint32 max_in_flight_batches = 1;
  uint32 max_batch_bytes = 2;
}

message Notice {
  string code = 1;
  string message = 2;
  string schema_version = 3;
}
