[package]
name = "ackplane-workctl"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "A command-line client for the Bridge's ADR-0125 Work command API."

[[bin]]
name = "ackplane-workctl"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
ureq = { workspace = true }
url = "2"

[dev-dependencies]
ackplane-bridge = { path = "../ackplane-bridge" }
ackplane-protocol = { path = "../ackplane-protocol" }
ackplane-server = { path = "../ackplane-server" }
axum = "0.7"
ed25519-dalek = "2.1"
tempfile = "3"
tokio = { workspace = true, features = ["net"] }
