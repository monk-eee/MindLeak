[package]
name = "lodestar-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MCP server exposing the Lodestar Intent Plane (constitution, tasks, conformance, knowledge) to coding agents over stdio."

[[bin]]
name = "lodestar-mcp"
path = "src/main.rs"

[dependencies]
ackplane-core = { path = "../ackplane-core" }
lodestar-core = { path = "../lodestar-core" }
mindleak-session = { path = "../mindleak-session" }
mindleak-storage = { path = "../mindleak-storage" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }

[features]
# Off by default (ADR-0094 decision 1's standalone product mode): a
# repository-local build carries no Ackplane client or async network stack
# unless this is explicitly requested.
federation-client = ["ackplane-core/federation-client"]
