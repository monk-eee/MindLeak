<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindLeak Bridge Work</title>
  <link rel="stylesheet" href="/static/shared/chrome.css">
  <link rel="stylesheet" href="/static/work-page.css">
</head>
<body>
  <header><div class="shell topbar"><a class="brand" href="/" aria-label="MindLeak Bridge Fleet" data-bridge-brand>MindLeak Bridge</a><nav class="nav" aria-label="Industrial surfaces" data-bridge-nav data-current="work"></nav></div></header>
  <script src="/static/shared/chrome.js" defer></script>
  <script src="/static/shared/repo-picker.js" defer></script>
  <main class="shell" id="work-page">
    <h1>Work</h1>
    <form id="repository-form" class="toolbar">
      <label for="repository-id">Repository<input id="repository-id" name="repository_id" list="known-repositories" autocomplete="off" required></label>
      <datalist id="known-repositories" data-repo-datalist></datalist>
      <label for="state-filter">State<select id="state-filter"><option value="">All</option><option value="open">Open</option><option value="claimed">Claimed</option><option value="waiting">Waiting</option><option value="paused">Paused</option><option value="blocked">Blocked</option><option value="in_review">In review</option><option value="completed">Completed</option><option value="abandoned">Abandoned</option></select></label>
      <button id="load-work" type="submit">Load</button>
    </form>
    <p id="notice" class="notice" role="status" aria-live="polite"></p>
    <div id="command-controls" class="command-controls" role="group" aria-label="Work commands"></div>
    <details id="more-actions"><summary>More actions</summary><div id="secondary-controls" class="command-controls" role="group" aria-label="Additional Work commands"></div></details>
    <p id="worker-status" class="muted" role="status"></p>
    <div class="work-layout">
      <section aria-labelledby="tasks-heading">
        <h2 id="tasks-heading">Tasks</h2>
        <div class="table-scroll"><table aria-label="Work tasks"><thead><tr><th scope="col">Task</th><th scope="col">State</th><th scope="col">Owner</th></tr></thead><tbody id="rows"><tr><td colspan="3">Select a repository.</td></tr></tbody></table></div>
        <div class="pager"><span id="pager-summary"></span><div><button type="button" id="prev-page" disabled>Previous</button><button type="button" id="next-page" disabled>Next</button></div></div>
      </section>
      <section id="task-detail" aria-labelledby="task-title" hidden>
        <h2 id="task-title" tabindex="-1"></h2><p id="detail-status" role="status"></p>
        <div id="detail-content" hidden>
          <p id="task-summary" class="muted"></p>
          <h3>Acceptance</h3><p id="acceptance" class="prose"></p>
          <h3>Declared scope</h3><ul id="task-scope" class="record-list"></ul><div id="scope-link"></div>
          <h3>Questions</h3><ul id="task-waits" class="record-list"></ul>
          <details><summary>Task record</summary><dl id="task-meta"></dl></details>
          <details><summary>History</summary><ol id="task-history" class="record-list"></ol></details>
          <nav id="record-links" class="record-links" aria-label="Task records"></nav>
        </div>
      </section>
    </div>
    <details id="publication" class="publication" hidden><summary id="publication-title">Publication</summary><p id="publication-summary"></p><ul id="claims-only-rows" class="record-list"></ul><a id="doctor-link">Board diagnostics (JSON)</a></details>
  </main>
  <dialog id="command-dialog" aria-labelledby="command-title">
    <form id="command-form">
      <div class="dialog-heading"><h2 id="command-title"></h2><button id="close-command" class="icon" type="button" aria-label="Close command" title="Close command">&times;</button></div>
      <p id="command-context" class="muted"></p>
      <fieldset id="command-fields"><div id="command-inputs"></div><label for="command-rationale">Reason<textarea id="command-rationale" required rows="2"></textarea></label></fieldset>
      <section id="command-preview" hidden aria-labelledby="preview-title"><h3 id="preview-title">Command preview</h3><dl id="preview-values"></dl></section>
      <p id="command-status" class="prose" role="status" aria-live="polite"></p>
      <div class="dialog-actions"><button id="cancel-command" class="secondary" type="button">Cancel</button><button id="prepare-command" type="submit">Preview</button><button id="confirm-command" type="button" hidden>Confirm command</button></div>
    </form>
  </dialog>
  <script type="module" src="/static/work-page.mjs"></script>
</body>
</html>
