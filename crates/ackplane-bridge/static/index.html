<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bridge Fleet</title>
  <script>
    (() => {
      const param = new URLSearchParams(window.location.search).get("scoutTheme");
      const theme =
        param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --cp-bg: #f7f4ef;
      --cp-bg-elevated: #fcfbf8;
      --cp-surface: #ffffff;
      --cp-surface-soft: #f5f5f5;
      --cp-border: #dedede;
      --cp-border-strong: #919191;
      --cp-text: #242424;
      --cp-text-muted: #5c5c5c;
      --cp-text-soft: #6f6f6f;
      --cp-accent: #b11f4b;
      --cp-accent-hover: #9a1a41;
      --cp-accent-soft: rgba(177, 31, 75, 0.08);
      --cp-accent-fg: #ffffff;
      --cp-success: #16a34a;
      --cp-danger: #dc2626;
      --cp-warning: #f59e0b;
      --cp-link: #0078d4;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
      --cp-overlay: rgba(255, 255, 255, 0.8);
      --cp-panel: rgba(255, 255, 255, 0.86);
      --cp-panel-strong: rgba(255, 255, 255, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.55);
      --cp-highlight: rgba(177, 31, 75, 0.12);
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --cp-bg: #3d3b3a;
      --cp-bg-elevated: #343231;
      --cp-surface: #292929;
      --cp-surface-soft: #2e2e2e;
      --cp-border: #474747;
      --cp-border-strong: #5f5f5f;
      --cp-text: #dedede;
      --cp-text-muted: #919191;
      --cp-text-soft: #b0b0b0;
      --cp-accent: #fd8ea1;
      --cp-accent-hover: #fb7b91;
      --cp-accent-soft: rgba(253, 142, 161, 0.14);
      --cp-accent-fg: #1a1a1a;
      --cp-success: #4ade80;
      --cp-danger: #f87171;
      --cp-warning: #fbbf24;
      --cp-link: #4da6ff;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      --cp-overlay: rgba(41, 41, 41, 0.88);
      --cp-panel: rgba(41, 41, 41, 0.72);
      --cp-panel-strong: rgba(41, 41, 41, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.04);
      --cp-highlight: rgba(253, 142, 161, 0.12);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--cp-bg); color: var(--cp-text); font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif; }
    header { border-bottom: 1px solid var(--cp-border); background: var(--cp-bg-elevated); }
    .masthead, main { width: min(1180px, calc(100% - 32px)); margin: 0 auto; }
    .masthead { display: flex; align-items: baseline; justify-content: space-between; gap: 24px; padding: 22px 0 20px; }
    h1 { margin: 0; font-size: 1.45rem; font-weight: 650; letter-spacing: 0; }
    .scope { margin: 0; color: var(--cp-text-muted); font-size: 0.9rem; }
    main { padding: 30px 0 48px; }
    .summary { display: flex; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
    .summary h2 { margin: 0; font-size: 1rem; font-weight: 650; }
    #status { margin: 0; color: var(--cp-text-muted); font-size: 0.9rem; }
    .fleet-table { width: 100%; border-collapse: collapse; background: var(--cp-surface); border: 1px solid var(--cp-border); }
    th, td { padding: 15px 16px; text-align: left; border-bottom: 1px solid var(--cp-border); vertical-align: middle; }
    th { background: var(--cp-surface-soft); color: var(--cp-text-muted); font-size: 0.78rem; font-weight: 650; letter-spacing: 0; text-transform: uppercase; }
    tr:last-child td { border-bottom: 0; }
    .repo { font-family: Consolas, "Courier New", Courier, monospace; font-size: 0.86rem; }
    .state { color: var(--cp-success); font-weight: 600; }
    .stale { color: var(--cp-warning); font-weight: 600; }
    .empty { padding: 42px 16px; color: var(--cp-text-muted); text-align: center; }
    .filters { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
    .filters label { font-size: 0.82rem; color: var(--cp-text-muted); display: flex; gap: 6px; align-items: center; }
    .filters select { font: inherit; padding: 4px 8px; border: 1px solid var(--cp-border); border-radius: 4px; background: var(--cp-surface); color: var(--cp-text); }
    .never_projected { color: var(--cp-text-soft); font-weight: 600; }
    .lagging { color: var(--cp-warning); font-weight: 600; }
    .fresh { color: var(--cp-success); font-weight: 600; }
    .detail-link { color: var(--cp-link); background: none; border: 0; font: inherit; cursor: pointer; padding: 0; text-decoration: underline; }
    .detail-row td { background: var(--cp-surface-soft); }
    .detail-row pre { margin: 0; white-space: pre-wrap; font-size: 0.82rem; }
    @media (max-width: 700px) {
      .masthead, .summary { align-items: flex-start; flex-direction: column; gap: 8px; }
      .fleet-table thead { display: none; }
      .fleet-table, .fleet-table tbody, .fleet-table tr, .fleet-table td { display: block; width: 100%; }
      .fleet-table tr { border-bottom: 1px solid var(--cp-border); padding: 8px 0; }
      .fleet-table tr:last-child { border-bottom: 0; }
      .fleet-table td { border: 0; padding: 6px 16px; }
      .fleet-table td::before { color: var(--cp-text-soft); content: attr(data-label) ": "; font-size: 0.78rem; }
      .fleet-table td.empty::before { content: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="masthead">
      <h1>Bridge Fleet</h1>
      <p class="scope">Tenant assurance view | accepted Ackplane records</p>
    </div>
  </header>
  <main>
    <section aria-labelledby="fleet-heading">
      <div class="summary">
        <h2 id="fleet-heading">Enrolled repositories</h2>
        <p id="status" aria-live="polite">Loading fleet...</p>
      </div>
      <div class="filters">
        <label>Freshness
          <select id="freshness-filter">
            <option value="">All</option>
            <option value="fresh">Fresh</option>
            <option value="lagging">Lagging</option>
            <option value="never_projected">Never projected</option>
          </select>
        </label>
        <label>Coordination
          <select id="coordination-filter">
            <option value="">All</option>
            <option value="active">Active nodes</option>
            <option value="none">No active nodes</option>
          </select>
        </label>
      </div>
      <table class="fleet-table">
        <thead><tr><th>Repository</th><th>Active nodes</th><th>Projection</th><th>Freshness</th><th>Last activated</th><th></th></tr></thead>
        <tbody id="fleet"></tbody>
      </table>
    </section>
  </main>
  <script>
    const status = document.getElementById("status");
    const fleet = document.getElementById("fleet");
    const freshnessFilter = document.getElementById("freshness-filter");
    const coordinationFilter = document.getElementById("coordination-filter");
    const timestamp = (seconds) => seconds ? new Date(seconds * 1000).toLocaleString() : "Unknown";
    const freshnessLabel = { fresh: "Fresh", lagging: "Lagging", never_projected: "Never projected" };
    let repositories = [];
    let openDetailId = null;
    const cell = (label, value, className = "") => {
      const element = document.createElement("td");
      element.dataset.label = label;
      element.textContent = value;
      if (className) element.className = className;
      return element;
    };
    async function loadRepositoryDetail(repositoryId) {
      const [detail, timeline] = await Promise.all([
        fetch(`/api/v1/repositories/${encodeURIComponent(repositoryId)}`).then((r) => (r.ok ? r.json() : null)),
        fetch(`/api/v1/repositories/${encodeURIComponent(repositoryId)}/timeline`).then((r) => (r.ok ? r.json() : null)),
      ]);
      return { detail, timeline };
    }
    function renderRows() {
      const freshness = freshnessFilter.value;
      const coordination = coordinationFilter.value;
      const visible = repositories.filter((repository) => {
        if (freshness && repository.freshness !== freshness) return false;
        if (coordination === "active" && repository.active_node_count <= 0) return false;
        if (coordination === "none" && repository.active_node_count > 0) return false;
        return true;
      });
      fleet.replaceChildren();
      if (!visible.length) {
        const row = document.createElement("tr");
        const empty = cell(
          "",
          repositories.length
            ? "No repositories match the current filters."
            : "No active enrollment receipts are available for this tenant.",
          "empty"
        );
        empty.colSpan = 6;
        row.append(empty);
        fleet.append(row);
        status.textContent = repositories.length
          ? `0 of ${repositories.length} repositories visible`
          : "0 repositories visible";
        return;
      }
      for (const repository of visible) {
        const row = document.createElement("tr");
        const projected = repository.projection_stream_position === null
          ? ["Not projected", "stale"]
          : [`Position ${repository.projection_stream_position}`, "state"];
        const detailCell = document.createElement("td");
        detailCell.dataset.label = "";
        const detailButton = document.createElement("button");
        detailButton.type = "button";
        detailButton.className = "detail-link";
        detailButton.textContent = openDetailId === repository.repository_id ? "Hide" : "Detail";
        detailButton.addEventListener("click", () => toggleDetail(repository.repository_id));
        detailCell.append(detailButton);
        row.append(
          cell("Repository", repository.repository_id, "repo"),
          cell("Active nodes", String(repository.active_node_count)),
          cell("Projection", projected[0], projected[1]),
          cell("Freshness", freshnessLabel[repository.freshness] ?? repository.freshness, repository.freshness),
          cell("Last activated", timestamp(repository.last_activated_at_seconds)),
          detailCell
        );
        fleet.append(row);
        if (openDetailId === repository.repository_id) {
          const detailRow = document.createElement("tr");
          detailRow.className = "detail-row";
          const detailCellExpanded = cell("", "Loading detail...");
          detailCellExpanded.colSpan = 6;
          detailRow.append(detailCellExpanded);
          fleet.append(detailRow);
          loadRepositoryDetail(repository.repository_id).then(({ detail, timeline }) => {
            const pre = document.createElement("pre");
            pre.textContent = JSON.stringify({ detail, timeline }, null, 2);
            detailCellExpanded.textContent = "";
            detailCellExpanded.append(pre);
          });
        }
      }
      status.textContent = visible.length === repositories.length
        ? `${repositories.length === 1 ? "1 repository" : `${repositories.length} repositories`} visible`
        : `${visible.length} of ${repositories.length} repositories visible`;
    }
    function toggleDetail(repositoryId) {
      openDetailId = openDetailId === repositoryId ? null : repositoryId;
      renderRows();
    }
    freshnessFilter.addEventListener("change", renderRows);
    coordinationFilter.addEventListener("change", renderRows);
    async function loadFleet() {
      try {
        const response = await fetch("/api/v1/fleet");
        if (!response.ok) throw new Error("Fleet request failed");
        const data = await response.json();
        repositories = data.repositories;
        renderRows();
      } catch (error) {
        repositories = [];
        fleet.replaceChildren();
        const row = document.createElement("tr");
        const empty = cell("", "Fleet data is unavailable. The Ackplane read service may be disconnected.", "empty");
        empty.colSpan = 6;
        row.append(empty);
        fleet.append(row);
        status.textContent = "Fleet unavailable";
      }
    }
    loadFleet();
  </script>
</body>
</html>
