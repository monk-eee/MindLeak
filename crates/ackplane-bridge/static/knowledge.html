<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindLeak Bridge Knowledge</title>
  <style>
    :root { color-scheme:light; --bg:#faf6f3; --surface:#fff; --soft:#f6f1ee; --line:#e9dfd9; --ink:#1f2542; --muted:#62677f; --quiet:#9094aa; --teal:#169c99; --amber:#d4881e; --rose:#e8578f; --danger:#c03d58; --focus:0 0 0 3px rgba(232,87,143,.28); }
    @media (prefers-color-scheme:dark) { :root { color-scheme:dark; --bg:#151827; --surface:#1d2135; --soft:#252a42; --line:#353b59; --ink:#f1f2fd; --muted:#afb3cd; --quiet:#8187a8; --teal:#56d4ce; --amber:#f2ba65; --rose:#ff8bb5; --danger:#ff8eaa; --focus:0 0 0 3px rgba(255,139,181,.36); } }
    * { box-sizing:border-box; } body { margin:0; background:var(--bg); color:var(--ink); font-family:"Segoe UI Variable", Aptos, system-ui, sans-serif; } button,input,select { font:inherit; } button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible { outline:none; box-shadow:var(--focus); }
    header { position:sticky; top:0; z-index:3; background:color-mix(in srgb,var(--bg) 94%,transparent); backdrop-filter:blur(14px); border-bottom:1px solid var(--line); } header::after { content:""; display:block; height:3px; background:linear-gradient(90deg,var(--teal),var(--rose)); } .shell { width:min(1160px,calc(100% - 36px)); margin:0 auto; } .masthead { min-height:72px; display:flex; align-items:center; justify-content:space-between; gap:18px; } .brand { display:flex; align-items:center; gap:11px; min-width:0; } .mark { width:34px; height:34px; border-radius:8px; background:linear-gradient(155deg,color-mix(in srgb,var(--teal) 18%,var(--surface)),color-mix(in srgb,var(--rose) 18%,var(--surface))); } .brand h1 { margin:0; font-size:1.05rem; } .brand p { margin:2px 0 0; font-size:.76rem; color:var(--quiet); } .nav { display:flex; flex-wrap:wrap; justify-content:end; gap:5px; } .nav a { padding:7px 9px; border-radius:6px; color:var(--muted); text-decoration:none; font-size:.78rem; font-weight:650; } .nav a:hover,.nav a[aria-current="page"] { background:var(--soft); color:var(--ink); } .nav a[aria-disabled="true"] { opacity:.5; pointer-events:none; }
    main { padding:28px 0 56px; } .heading { display:flex; justify-content:space-between; gap:18px; flex-wrap:wrap; align-items:end; margin-bottom:18px; } .eyebrow { margin:0 0 5px; color:var(--quiet); font-size:.69rem; font-weight:750; letter-spacing:.09em; text-transform:uppercase; } h2 { margin:0; font-size:1.55rem; } .heading p:last-child { margin:5px 0 0; color:var(--muted); font-size:.86rem; }
    .toolbar,.panel { min-width:0; border:1px solid var(--line); border-radius:8px; background:var(--surface); } .toolbar { display:grid; grid-template-columns:minmax(0,1fr) 160px 130px auto; gap:10px; align-items:end; padding:13px; } label { display:grid; gap:5px; color:var(--quiet); font-size:.7rem; font-weight:700; letter-spacing:.045em; text-transform:uppercase; } input,select { width:100%; min-width:0; padding:9px 10px; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:6px; font-size:.85rem; text-transform:none; letter-spacing:0; } button { height:37px; padding:0 13px; border:1px solid transparent; border-radius:6px; background:var(--ink); color:var(--surface); font-size:.82rem; font-weight:700; cursor:pointer; } .message { min-height:22px; margin:12px 2px; color:var(--muted); font-size:.82rem; } .message.error { color:var(--danger); }
    .panel-head { display:flex; justify-content:space-between; gap:10px; align-items:center; padding:14px 15px; border-bottom:1px solid var(--line); } .panel-head h3 { margin:0; font-size:.92rem; } .count { color:var(--quiet); font-size:.74rem; } .rows { list-style:none; margin:0; padding:0; } .row { border-bottom:1px solid var(--line); } .row:last-child { border-bottom:0; } details { padding:0; } summary { list-style:none; cursor:pointer; display:grid; grid-template-columns:9px minmax(0,1fr) auto; gap:10px; align-items:center; padding:13px 15px; } summary::-webkit-details-marker { display:none; } .indicator { width:8px; height:8px; border-radius:50%; background:var(--teal); } .indicator.retired { background:var(--amber); } .title { min-width:0; font-size:.83rem; font-weight:700; overflow-wrap:anywhere; } .lifecycle { color:var(--quiet); font-size:.7rem; text-transform:capitalize; } .detail { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px 18px; padding:0 15px 15px 34px; color:var(--muted); font-size:.76rem; } .detail b { display:block; color:var(--quiet); font-size:.64rem; letter-spacing:.05em; text-transform:uppercase; margin-bottom:3px; } .detail span { overflow-wrap:anywhere; } .empty { padding:34px 18px; color:var(--quiet); text-align:center; font-size:.83rem; } .hidden { display:none !important; }
    @media (max-width:760px) { .toolbar { grid-template-columns:1fr 1fr; } .toolbar button { grid-column:1 / -1; } .detail { grid-template-columns:1fr; padding-left:15px; } } @media (max-width:600px) { .shell { width:min(100% - 24px,1160px); } .masthead { align-items:start; padding:14px 0; } .nav { justify-content:start; } }
  </style>
</head>
<body>
  <header><div class="shell masthead"><div class="brand"><div class="mark" aria-hidden="true"></div><div><h1>MindLeak Bridge</h1><p>Industrial knowledge lifecycle</p></div></div><nav class="nav" aria-label="Industrial surfaces"><a href="/">Fleet</a><a href="/agents">Agents</a><a href="/evidence">Evidence</a><a href="/telemetry">Telemetry</a><a href="/context">Context</a><a href="/knowledge" aria-current="page">Knowledge</a><a href="/work">Work</a><a href="/board-doctor">Board Doctor</a><a href="/supervisors">Supervisors</a><a href="/administration">Administration</a><a href="/delegations">Delegations</a><a href="/live">Live Feed</a><a aria-disabled="true">Design</a><a href="/constitution">Constitution</a></nav></div></header>
  <main class="shell"><div class="heading"><div><p class="eyebrow">Durable guidance</p><h2>Knowledge Lifecycle</h2><p id="scope">Select an enrolled repository.</p></div></div><form id="filters" class="toolbar"><label>Repository<input id="repository" required autocomplete="off" spellcheck="false"></label><label>Lifecycle<select id="state"><option value="all">All records</option><option value="active">Active</option><option value="retired">Retired</option></select></label><label>Limit<select id="limit"><option>10</option><option selected>30</option><option>50</option><option>100</option></select></label><button type="submit">Load history</button></form><p id="message" class="message" role="status" aria-live="polite"></p><section id="panel" class="panel hidden"><div class="panel-head"><h3>Knowledge records</h3><span id="count" class="count"></span></div><ul id="records" class="rows"></ul></section></main>
  <script>
    const els={form:document.getElementById("filters"),repo:document.getElementById("repository"),state:document.getElementById("state"),limit:document.getElementById("limit"),message:document.getElementById("message"),panel:document.getElementById("panel"),records:document.getElementById("records"),count:document.getElementById("count"),scope:document.getElementById("scope")}; const params=new URLSearchParams(location.search); els.repo.value=params.get("repository")||""; els.state.value=params.get("state")||"all";
    const escape=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[char])); const when=seconds=>Number.isFinite(seconds)?new Date(seconds*1000).toLocaleString():"not reported"; const message=(text,error=false)=>{els.message.textContent=text;els.message.classList.toggle("error",error)}; const endpoint=()=>`/api/v1/repositories/${encodeURIComponent(els.repo.value.trim())}/knowledge/history`;
    const field=(label,value)=>`<div><b>${escape(label)}</b><span>${escape(value||"not reported")}</span></div>`; const row=entry=>`<li class="row"><details><summary><span class="indicator ${escape(entry.lifecycle)}"></span><span class="title">${escape(entry.content)}</span><span class="lifecycle">${escape(entry.lifecycle)}</span></summary><div class="detail">${field("Knowledge id",entry.knowledge_id)}${field("Source",entry.source_ref)}${field("Recorded by",entry.recorded_by)}${field("Confirmed",when(entry.confirmed_at_seconds))}${field("Reach",entry.reach_goal_id?`${entry.reach_goal_id} · ${entry.reach_count} nodes`:`${entry.reach_count} nodes`)}${field("Reconfirmed",entry.last_reconfirmed_at_seconds?`${when(entry.last_reconfirmed_at_seconds)} · ${entry.last_reconfirmed_by||"unknown"}`:null)}${field("Reconfirmation evidence",entry.last_reconfirmation_evidence_ref)}${field("Retired",entry.retired_at_seconds?`${when(entry.retired_at_seconds)} · ${entry.retired_by||"unknown"}`:null)}${field("Retirement reason",entry.retired_reason)}</div></details></li>`;
    async function load(){if(!els.form.reportValidity())return;const query=new URLSearchParams({limit:els.limit.value,state:els.state.value});message("Loading knowledge history...");try{const response=await fetch(`${endpoint()}?${query}`);if(!response.ok)throw new Error(response.status===404?"Repository is outside the current scope.":`Knowledge history request failed (${response.status}).`);const result=await response.json();els.records.innerHTML=result.entries.length?result.entries.map(row).join(""):`<li class="empty">No ${escape(result.state_filter)} knowledge records are visible.</li>`;els.count.textContent=`${result.entries.length} record${result.entries.length===1?"":"s"}`;els.scope.textContent=`${els.repo.value.trim()} · ${result.state_filter} history`;els.panel.classList.remove("hidden");history.replaceState(null,"",`/knowledge?repository=${encodeURIComponent(els.repo.value.trim())}&state=${encodeURIComponent(els.state.value)}`);message("Loaded.")}catch(error){message(error.message,true)}}
    els.form.addEventListener("submit",event=>{event.preventDefault();load()});if(els.repo.value)load();
  </script>
</body>
</html>
