[package]
name = "ackplane-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The Ackplane federation service: a separately deployable arbiter for one organisation boundary (ADR-0082)."

# Deliberately depends on no plane crate. ADR-0082 clause 1 makes Ackplane a
# separate deployable rather than a mode of mindleak-mcp or lodestar-mcp, and a
# dependency edge here would be the first step back to it being one.
[dependencies]
# The wire contract this service exists to serve. ADR-0082 clause 1 forbids
# depending on a plane crate, which this is not.
ackplane-protocol = { path = "../ackplane-protocol" }
ed25519-dalek = "2.1"
getrandom = "0.2"
pgvector = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
tokio-postgres = { workspace = true }
tokio-stream = "0.1"
tonic = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
time = { version = "=0.3.36", features = ["formatting", "parsing"] }
