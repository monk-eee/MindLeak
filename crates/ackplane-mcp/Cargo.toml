[package]
name = "ackplane-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "MCP front door that translates tool calls into Ackplane's typed gRPC services (ADR-0136)."

[[bin]]
name = "ackplane-mcp"
path = "src/main.rs"

[dependencies]
ackplane-client = { path = "../ackplane-client" }
ackplane-protocol = { path = "../ackplane-protocol" }
anyhow = { workspace = true }
mindleak-model = { path = "../mindleak-model", features = ["embedding"] }
mindleak-session = { path = "../mindleak-session" }
prost = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
ureq = { workspace = true }
url = { workspace = true }

[dev-dependencies]
ackplane-node = { path = "../ackplane-node" }
axum = "0.7"
tempfile = "3"
ackplane-server = { path = "../ackplane-server" }
ed25519-dalek = "2.1"
time = { version = "0.3.47", features = ["formatting"] }
tokio = { workspace = true, features = ["net", "sync", "process", "io-util"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { workspace = true }
