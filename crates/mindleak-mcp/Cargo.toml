[package]
name = "mindleak-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MCP server exposing the MindLeak temporal context graph to coding agents over stdio."

[[bin]]
name = "mindleak-mcp"
path = "src/main.rs"

[dependencies]
ackplane-core = { path = "../ackplane-core" }
mindleak-core = { path = "../mindleak-core" }
mindleak-session = { path = "../mindleak-session" }
mindleak-storage = { path = "../mindleak-storage" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }

[features]
# Off by default so a plain `cargo build` stays lean: an unadorned
# repository-local build carries no Ackplane client or async network stack.
#
# Shipped release binaries DO enable this (see .github/workflows/release.yml).
# ADR-0105 decision 3 makes Local vs Industrial a runtime declaration, so a
# distributed binary must be able to honour either answer. (The previous note
# here cited ADR-0094 decision 1, which ADR-0105 superseded.)
federation-client = ["ackplane-core/federation-client"]

[dev-dependencies]
mindleak-model = { path = "../mindleak-model", features = ["test-support"] }
