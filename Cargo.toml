[workspace]
resolver = "2"
members = [
    "crates/mindleak-model",
    "crates/mindleak-session",
    "crates/mindleak-storage",
    "crates/mindleak-core",
    "crates/mindleak-mcp",
    "crates/lodestar-core",
    "crates/lodestar-mcp",
    "crates/ackplane-core",
    "crates/ackplane-protocol",
    "crates/ackplane-client",
    "crates/ackplane-server",
    "crates/ackplane-supervisor",
    "crates/ackplane-bridge",
    "crates/mindleak-coordinator",
]

[workspace.package]
version = "0.1.7-alpha"
edition = "2021"
license = "MIT"
repository = "https://github.com/monk-eee/MindLeak"
# Set by the locked dependency graph, not by this workspace's own syntax:
# `time`/`time-core` declare 1.88. Raise this and the Dockerfile's pinned base
# together, or the container build breaks while CI stays green on stable.
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "=0.8.10"
url = "2"
pep508_rs = "=0.6.1"
rusqlite = { version = "0.31", features = ["backup", "bundled", "functions"] }
regex = "1"
globset = "0.4"
sha2 = "0.10"
thiserror = "1"
ureq = { version = "2", features = ["json"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
prost = "0.13"
tonic = { version = "0.12", features = ["tls"] }
tonic-build = "0.12"
protoc-bin-vendored = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-postgres = "0.7"
# ADR-0106 decision 3: the Ackplane knowledge domain ranks embeddings through
# Postgres itself (pgvector's `<=>` operator), not an application-side cosine
# loop -- the exact SQLite scaling limit that domain exists to not repeat.
pgvector = { version = "0.4", features = ["postgres"] }

[profile.release]
lto = "thin"
strip = true
