# Ackplane's supported local-development and small self-hosting topology
# (ADR-0088 clauses 1, 3, 5, 6, 8). A developer types `docker compose` and
# nothing else; every host-side operation beyond bringing the stack up and
# down goes through `node scripts/ackplane-compose.mjs` (clause 3, clause 7).
#
# This is not the production deployment contract (clause 8): one PostgreSQL
# container is not a fenced primary, credentials below are development-only,
# and nothing here is meant to accrete production-only features over time.
name: ackplane

services:
  # Pinned by tag and digest (clause 4). pgvector/pgvector:pg16 is upstream
  # postgres:16 with the pgvector extension already installed (ADR-0106
  # decision 3's knowledge domain needs it) -- same major version, same
  # data format, nothing else about the topology changes.
  postgres:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    # Development-topology connection ceiling, measured rather than guessed
    # (2026-08-29). Postgres defaults to 100, which was never a considered
    # value for this workload and is not enough for it: every store opens its
    # own connection, so the two long-running service containers alone hold 28
    # before any test starts (`ackplane-bridge` 17, `ackplane-server` 11 --
    # one per `::connect(` call site, confirmed against `pg_stat_activity`).
    # One crate's DB-gated tests then peaked at 73 total, and running two
    # crates concurrently -- which `cargo test --all` does -- exhausted the
    # ceiling outright.
    #
    # The failure that produces is badly misleading: `SqlState(E53300)` "sorry,
    # too many clients already" surfaces as a dozen unrelated subsystems
    # failing at once, and the test names never mention connections, so an
    # agent validating their own change goes looking for a cause inside it.
    #
    # This is a development-stack value only. It is not a production tuning
    # claim; see docs/POSTGRES-CONNECTION-BUDGET.md for that, and
    # crates/ackplane-server/src/db_pool.rs for the bounded pool + backpressure
    # that make a per-process connection budget an enforced fact rather than
    # a hope.
    command: ["postgres", "-c", "max_connections=500"]
    environment:
      # Development-only credentials (clause 6). Never used outside this
      # Compose stack, and never the production deployment's answer.
      POSTGRES_USER: ackplane
      POSTGRES_PASSWORD: ackplane-development-only-not-for-production
      POSTGRES_DB: ackplane
    volumes:
      - ackplane-postgres-data:/var/lib/postgresql/data
    ports:
      # Loopback only, so this is reachable for local `psql` debugging and
      # nowhere else (clause 6). Not published at all is also a reasonable
      # choice; this keeps the common "just want to poke at the dev DB" case
      # a single `psql` invocation away.
      - "127.0.0.1:${ACKPLANE_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ackplane -d ackplane"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Runs to completion and exits; the `ackplane` service starts only after
  # this succeeds and `postgres` reports healthy (clause 5). Never runs
  # automatically against a database this Compose file did not start.
  migrate:
    build:
      context: .
      dockerfile: crates/ackplane-server/Dockerfile
      args:
        ACKPLANE_VERSION: ${ACKPLANE_VERSION:-dev}
        ACKPLANE_COMMIT: ${ACKPLANE_COMMIT:-unknown}
    entrypoint: ["/usr/local/bin/ackplane-migrate"]
    environment:
      ACKPLANE_DATABASE_URL: postgresql://ackplane:ackplane-development-only-not-for-production@postgres:5432/ackplane
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ADR-0133: creates an empty `ackplane_test` database, separate from the
  # `ackplane` database the long-running service below actually operates
  # against, so a local `cargo test` run never shares mutable state with a
  # live projection worker. Idempotent (checked via `psql`'s own database
  # listing, since Postgres has no `CREATE DATABASE IF NOT EXISTS`) and run
  # from the same pinned image as `postgres` itself -- one image's
  # provenance to audit for this step, not a second base image, the same
  # reasoning `tls-init` below gives for reusing the server's own image.
  test-db-init:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    entrypoint: ["/bin/sh", "-euc"]
    command:
      - |
        export PGPASSWORD="$$POSTGRES_PASSWORD"
        if psql -h postgres -U "$$POSTGRES_USER" -lqt | cut -d '|' -f1 | grep -qw ackplane_test; then
          echo "test-db-init: ackplane_test already exists, leaving it alone"
        else
          echo "test-db-init: creating ackplane_test"
          createdb -h postgres -U "$$POSTGRES_USER" ackplane_test
        fi
    environment:
      POSTGRES_USER: ackplane
      POSTGRES_PASSWORD: ackplane-development-only-not-for-production
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ADR-0133: migrates `ackplane_test`, mirroring `migrate` above exactly
  # except for the database name. Nothing else in this file ever points at
  # `ackplane_test` -- that is what keeps a local test run isolated from the
  # `ackplane` service's own projection worker, not merely a separate
  # database name by convention.
  migrate-test:
    build:
      context: .
      dockerfile: crates/ackplane-server/Dockerfile
      args:
        ACKPLANE_VERSION: ${ACKPLANE_VERSION:-dev}
        ACKPLANE_COMMIT: ${ACKPLANE_COMMIT:-unknown}
    entrypoint: ["/usr/local/bin/ackplane-migrate"]
    environment:
      ACKPLANE_DATABASE_URL: postgresql://ackplane:ackplane-development-only-not-for-production@postgres:5432/ackplane_test
    depends_on:
      test-db-init:
        condition: service_completed_successfully
    restart: "no"

  # Generates the development TLS material the `ackplane` service serves, into
  # a named volume, then exits (clause 5). Runs from the same pinned image as
  # the server so there is one provenance to audit, not two.
  #
  # This exists so the default documented topology satisfies ADR-0083 clause 8
  # honestly rather than leaning on ADR-0132's confinement acknowledgement: a
  # container must bind 0.0.0.0 to be reachable through a published port at
  # all, and "it is only published to loopback" is a claim the server cannot
  # verify from inside. Serving a real certificate needs no such claim.
  #
  # Idempotent: regenerates only when the material is missing, so restarting
  # the stack does not silently rotate the certificate under a client that
  # pinned it. Runs as root because a fresh named volume is root-owned; the
  # key is handed to the server's unprivileged uid and nobody else.
  tls-init:
    build:
      context: .
      dockerfile: crates/ackplane-server/Dockerfile
      args:
        ACKPLANE_VERSION: ${ACKPLANE_VERSION:-dev}
        ACKPLANE_COMMIT: ${ACKPLANE_COMMIT:-unknown}
    user: "0:0"
    entrypoint: ["/bin/sh", "-euc"]
    command:
      - |
        if [ -s /tls/server.crt ] && [ -s /tls/server.key ]; then
          echo "tls-init: development certificate already present, keeping it"
        else
          echo "tls-init: generating a self-signed development certificate"
          openssl req -x509 -newkey rsa:2048 -nodes -days 365 \
            -subj "/CN=ackplane" \
            -addext "subjectAltName=DNS:ackplane,DNS:localhost,IP:127.0.0.1" \
            -keyout /tls/server.key -out /tls/server.crt
        fi
        chown 10001:10001 /tls/server.crt /tls/server.key
        chmod 644 /tls/server.crt
        chmod 600 /tls/server.key
    volumes:
      - ackplane-tls:/tls
    restart: "no"

  # Bound to loopback only by default (clause 6): the container listens on
  # every interface internally (ACKPLANE_LISTEN=0.0.0.0), but the published
  # port below is what actually decides reachability from the host, and that
  # stays 127.0.0.1. Reports `single_node` durability (clause 6): one
  # PostgreSQL container is not a fenced primary with synchronous standbys.
  #
  # ADR-0083's gRPC service has landed and serves real NodeSync traffic
  # (connection-authenticated since PR #501), so this is a long-running
  # service now, not the exit-after-banner placeholder it used to be.
  # Restart and healthcheck follow the same pattern as `postgres` above
  # (clause 5: service ordering uses healthchecks rather than sleeps).
  ackplane:
    build:
      context: .
      dockerfile: crates/ackplane-server/Dockerfile
      args:
        ACKPLANE_VERSION: ${ACKPLANE_VERSION:-dev}
        ACKPLANE_COMMIT: ${ACKPLANE_COMMIT:-unknown}
    environment:
      ACKPLANE_DATABASE_URL: postgresql://ackplane:ackplane-development-only-not-for-production@postgres:5432/ackplane
      ACKPLANE_LISTEN: 0.0.0.0:8443
      ACKPLANE_DURABILITY: single_node
      # Development material from `tls-init` above, not a production answer
      # (clause 6). Its presence is what makes the 0.0.0.0 bind legitimate.
      ACKPLANE_TLS_CERTIFICATE_PATH: /tls/server.crt
      ACKPLANE_TLS_KEY_PATH: /tls/server.key
    volumes:
      - ackplane-tls:/tls:ro
    ports:
      - "127.0.0.1:${ACKPLANE_PORT:-8443}:8443"
    depends_on:
      migrate:
        condition: service_completed_successfully
      tls-init:
        condition: service_completed_successfully
    healthcheck:
      # A bare TCP connect, not a real gRPC health check (the service does not
      # implement grpc.health.v1.Health yet). Proves the port accepts
      # connections, which is enough to order dependants after it; a real
      # protocol-aware check is its own follow-on if this proves insufficient.
      test: ["CMD", "nc", "-z", "127.0.0.1", "8443"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # ADR-0105 decision 3: the Industrial setup flow starts the supported local
  # Compose stack "and Bridge" together, so `docker compose up` brings up
  # Ackplane's own assurance/human-operations surface alongside it rather than
  # leaving it a separate manual step. Bridge never gRPC-connects to the
  # `ackplane` service above -- every store it opens (`FleetStore`,
  # `KnowledgeStore`, `ConstitutionStore`, `Projector`, ...) is a direct
  # `tokio_postgres` connection to the same database `ackplane` migrates and
  # serves (`crates/ackplane-bridge/src/main.rs`) -- so it only has to wait for
  # `migrate` to have applied the schema, not for `ackplane` itself to be
  # running or healthy.
  bridge:
    build:
      context: .
      dockerfile: crates/ackplane-bridge/Dockerfile
      args:
        ACKPLANE_VERSION: ${ACKPLANE_VERSION:-dev}
        ACKPLANE_COMMIT: ${ACKPLANE_COMMIT:-unknown}
    environment:
      ACKPLANE_DATABASE_URL: postgresql://ackplane:ackplane-development-only-not-for-production@postgres:5432/ackplane
      # Development-only tenant label (clause 6): salted into
      # `development_tenant_token` (ADR-0098 decision 3) before it is ever
      # rendered or logged, so this raw value never itself grants access.
      ACKPLANE_BRIDGE_DEVELOPMENT_TENANT: local-development
      # `ACKPLANE_BRIDGE_LISTEN` is left unset: `BridgeConfig::resolve` refuses
      # any non-loopback address (ADR-0094 has no production authentication
      # verifier for the Bridge yet), so it must keep its own default
      # (`127.0.0.1:3000`) rather than the `ackplane` service's ADR-0132 stance
      # of binding every interface behind a loopback-published port.
      ACKPLANE_BRIDGE_SALT_PATH: /var/lib/ackplane-bridge/salt
    volumes:
      - ackplane-bridge-salt:/var/lib/ackplane-bridge
    ports:
      # Published from port 3001, not Bridge's own 3000: Bridge's process
      # binds only 127.0.0.1:3000 inside the container (see the env comment
      # above), and Docker's published-port mechanism forwards host traffic
      # to a container's real network interface, never to that container's
      # own loopback -- confirmed empirically, a host curl against 3000
      # published directly hung rather than connecting even though the
      # container reported healthy. `docker-entrypoint.sh`'s socat relay
      # listens on 3001 on every interface and forwards to Bridge's own
      # 127.0.0.1:3000, so this published port reaches it without loosening
      # BridgeConfig's own validation at all. The host-facing port still
      # follows the `ACKPLANE_BRIDGE_PORT` pattern and still defaults to
      # 3000, so nothing about the documented developer-facing URL changes.
      - "127.0.0.1:${ACKPLANE_BRIDGE_PORT:-3000}:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Exercises the relay's own listening port (3001), not Bridge's direct
      # loopback bind (3000): a healthcheck runs inside the container's own
      # network namespace, where 3000 is always reachable regardless of
      # whether the relay is up at all, so testing 3000 could never have
      # caught the gap this relay exists to close. Testing 3001 at least
      # proves the relay process itself started and is forwarding -- the
      # piece most likely to fail on a rebuild -- though, like `ackplane`'s
      # own in-container TCP probe above, no in-container healthcheck can
      # prove genuine reachability from outside the container; that is what
      # the documented host curl step validates instead.
      test: ["CMD", "curl", "-sf", "-o", "/dev/null", "http://127.0.0.1:3001/"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  # Named volume (clause 7): recreating a container never destroys the ledger
  # as a side effect. Lifecycle commands (backup, restore, reset) are
  # documented and scripted in scripts/ackplane-compose.mjs.
  ackplane-postgres-data:
  # The development certificate, kept across restarts so the endpoint's
  # identity is stable for anything that pinned it.
  ackplane-tls:
  # The Bridge's per-installation developer-tenant salt (ADR-0098 decision 3),
  # kept across restarts so `development_tenant_token` stays stable for
  # anything that pinned it, exactly like `ackplane-tls` above does for the
  # server's certificate identity.
  ackplane-bridge-salt:
