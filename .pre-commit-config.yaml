# Pre-commit hooks for MindLeak.
# Install once:  pip install pre-commit  &&  pre-commit install  &&  pre-commit install --hook-type pre-push
# Run manually:  pre-commit run --all-files
minimum_pre_commit_version: "3.5.0"

# Installing every hook type by default matters more than it looks. A hook that
# has to be installed with an extra flag is a hook most checkouts do not have,
# and `post-commit` is the one that records evidence -- if it is missing, the
# work is unattributable and nothing says so until `complete_task` refuses,
# hours later, with no way left to repair it (ADR-0048).
default_install_hook_types: [pre-commit, pre-push, post-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  - repo: local
    hooks:
      - id: worktree-owner
        name: worktree ownership (one writer per worktree)
        entry: node scripts/worktree-owner.mjs
        language: system
        always_run: true
        pass_filenames: false

      - id: commit-identity
        name: the commit author is a real contributor
        entry: node scripts/commit-identity.mjs
        language: system
        always_run: true
        pass_filenames: false

      - id: no-shell-plumbing
        name: no shell-specific plumbing in committed files
        entry: node scripts/no-shell-plumbing.mjs
        language: system
        files: \.(md|mjs|cjs|js|ts|yml|yaml|toml|rs|sql|sh)$|(^|/)Makefile$

      - id: cargo-fmt
        name: cargo fmt (scoped)
        entry: node scripts/cargo-precommit.mjs fmt commit
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy (scoped, committed snapshot)
        entry: node scripts/cargo-precommit.mjs clippy commit
        language: system
        types: [rust]
        pass_filenames: false

      - id: eslint
        name: eslint (vscode extension)
        # Lint only the staged files, not the whole tree, so another agent's
        # unrelated WIP can never poison this commit (ADR-0018).
        entry: node editors/vscode/node_modules/eslint/bin/eslint.js --max-warnings=0
        language: system
        files: ^editors/vscode/src/.*\.ts$
        pass_filenames: true

      - id: prettier
        name: prettier (vscode extension)
        # Check only the staged files, not the whole tree, so another agent's
        # unformatted WIP can never poison this commit (ADR-0018).
        # This set must match the `format` script in editors/vscode/package.json,
        # which is what CI checks. It did not: editors/vscode/scripts/*.mjs was
        # checked by CI and not by this hook, so nine test files were formatted
        # only by luck and a tenth failed the build.
        entry: node editors/vscode/node_modules/prettier/bin/prettier.cjs --check
        language: system
        files: ^(editors/vscode/(src|media|scripts)/.*\.(ts|js|mjs|cjs)|scripts/.*\.mjs)$
        pass_filenames: true

      - id: adr-number-guard
        name: ADR number not already claimed on another ref
        # ADR numbers are a shared counter with no coordination: each branch
        # reads "the next number" from a view that cannot see a sibling's
        # in-flight ADR. Catching the collision here costs seconds; catching it
        # at merge costs a renumber across the file, its cross-links, and every
        # commit message citing it.
        entry: node scripts/adr-number-guard.mjs
        language: system
        files: ^docs/adr/\d{4}-.*\.md$
        pass_filenames: true

      - id: merge-driver-guard
        name: no merge driver in any .gitattributes
        # A merge driver runs only in a local checkout. GitHub's update-branch,
        # the merge queue, and the merge itself run server-side with no driver
        # configured, so the attribute silently does not apply and the branch
        # reports a conflict in the very file it promised to keep clean.
        # `merge=union` on CHANGELOG.md cost an evening to diagnose; use
        # per-change fragment files, which never write the same path twice.
        entry: node scripts/merge-driver-guard.mjs
        language: system
        files: (^|/)\.gitattributes$
        pass_filenames: true

      - id: adr-index
        name: ADR index matches the ADR files
        # The index is derived data: number, title, and status all live in the
        # ADR itself. Hand-maintaining it meant every concurrent branch appended
        # a row to the same table, so every merge conflicted on it — and the
        # table drifted anyway. Ten of forty-five rows were wrong when this was
        # added, including an ADR the whole constitution backlog gates on.
        entry: node scripts/adr-index.mjs --check
        language: system
        files: ^docs/adr/.*\.md$
        pass_filenames: false

      - id: changelog-fragments
        name: changelog fragments are usable
        # A fragment that cannot be placed is silently lost at release, which is
        # the one failure this convention must not have: the change describes
        # itself, so losing the description loses the record (ADR-0056). An
        # unrecognised section prefix or an entry that is not a bullet fails
        # here, where it costs seconds.
        entry: node scripts/changelog.mjs --check
        language: system
        files: ^changelog\.d/.*\.md$
        pass_filenames: false

      - id: gap-fragments
        name: known gap fragments are usable
        # Same shape as changelog fragments, same reason (ADR-0056): the Known
        # gaps section was one shared append-only list, so two agents recording
        # two unrelated gaps collided on the same paragraph. A malformed
        # fragment fails here rather than being quietly skipped by `--list`,
        # which would make a recorded gap unreadable while still looking filed.
        entry: node scripts/gaps.mjs --check
        language: system
        files: ^gaps\.d/.*\.md$
        pass_filenames: false

      - id: canonical-push
        name: canonical fleet publisher
        entry: node scripts/canonical-push.mjs --verify-pre-push
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # A hook type declared in default_install_hook_types only installs when
      # `pre-commit install` is re-run, and the hooks directory is shared across
      # every worktree — so a checkout made before post-commit was added keeps
      # committing with no provenance, and nothing says so, because the hook
      # that would announce it is the one that is missing. Verify the full set
      # on the way out, on a path (pre-push) that is itself installed.
      - id: hook-health
        name: the shared hooks directory has every declared hook
        entry: node scripts/hook-health.mjs
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # An ADR left in the working tree is one `git clean -fd` from gone, and
      # nothing else reports it. Only the working-tree check runs here: the
      # unpublished check would fail the very push that publishes the ADR.
      - id: adr-guard
        name: no ADR left uncommitted
        entry: node scripts/adr-guard.mjs --uncommitted
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # Slower gate — runs on push, not every commit. Validates the pushed
      # commit's tree so another agent's uncommitted WIP cannot poison it.
      - id: cargo-test
        name: cargo test (scoped, committed snapshot)
        entry: node scripts/cargo-precommit.mjs test push
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]

      # The guards themselves. These cover the conformance gate, merge-driver
      # guard, claim gate, publication record, delivery queue and board health
      # — the machinery that decides whether work is honest. Cheap enough to
      # run on every push, and a broken guard is worth catching before it is
      # trusted rather than after.
      - id: script-tests
        name: script tests (guards for the guards)
        entry: node scripts/script-tests.mjs
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # The same modules, the other runner. `scripts/*.test.mjs` are node:test
      # suites; `editors/vscode/scripts/*.test.mjs` are vitest suites importing
      # the very same modules through `../../../scripts/`. Only the first ran
      # before a push, so renaming an export or a guidance string passed every
      # local check and failed in CI on assertions the author had no reason to
      # run. Three pull requests were blocked on exactly that at once —
      # `droppedCommits` -> `classifyCommits`, and `claim_task` -> `task_claim`
      # — each an owner discovering their own rename from a red build.
      #
      # Filenames are passed so it runs only the suite covering a module that
      # actually changed: about 18s for one, against ~120s for the whole
      # extension suite, which also reports vitest worker timeouts under fleet
      # load. A gate that intermittently blocks a push is worse than none — it
      # teaches people to reach for `--no-verify`.
      #
      # WITHDRAWN FROM pre-push, 2026-07-30. That last sentence turned out to
      # describe this hook. Under fleet load vitest reports
      # `[vitest-worker]: Timeout calling "onTaskUpdate"` and exits non-zero
      # with every test passing — "14 passed, 1 error" — and the runner cannot
      # tell that from a real failure. It blocked pushes across the fleet on
      # tests that had in fact passed, which is worse than the rename breakage
      # it was added to catch: that fails one branch's CI, this stops everyone.
      #
      # The capability is kept, not the gate. `make ext-test` and
      # `node scripts/ext-test.mjs <changed files>` still run it, and CI still
      # runs the full suite. It comes back to pre-push when it can distinguish
      # a worker timeout from a failed assertion, and not before.

      # Evidence exists because you committed, not because you remembered.
      # Forty conformance audits on this repository reported "evidence contains
      # no provenance-bearing mutation" -- every bundle empty, because
      # `ingest_commit` had to be called by hand at the moment the work felt
      # finished. Nothing here that relies on remembering has ever worked; what
      # works is hanging the obligation off something already being done.
      #
      # It never fails a commit and never prints on the happy path. A hook that
      # can block work gets uninstalled, and then the graph is worse off than
      # if it had never existed.
      - id: ingest-commit
        name: record the commit as evidence
        entry: node scripts/ingest-commit.mjs
        language: system
        pass_filenames: false
        always_run: true
        verbose: false
        stages: [post-commit]
