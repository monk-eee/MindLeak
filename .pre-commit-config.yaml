# Pre-commit hooks for MindLeak.
# Install once:  pip install pre-commit  &&  pre-commit install  &&  pre-commit install --hook-type pre-push
# Run manually:  pre-commit run --all-files
minimum_pre_commit_version: "3.5.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt (scoped)
        entry: node scripts/cargo-precommit.mjs fmt commit
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy (scoped, committed snapshot)
        entry: node scripts/cargo-precommit.mjs clippy commit
        language: system
        types: [rust]
        pass_filenames: false

      - id: eslint
        name: eslint (vscode extension)
        # Lint only the staged files, not the whole tree, so another agent's
        # unrelated WIP can never poison this commit (ADR-0018).
        entry: node editors/vscode/node_modules/eslint/bin/eslint.js --max-warnings=0
        language: system
        files: ^editors/vscode/src/.*\.ts$
        pass_filenames: true

      - id: prettier
        name: prettier (vscode extension)
        # Check only the staged files, not the whole tree, so another agent's
        # unformatted WIP can never poison this commit (ADR-0018).
        # This set must match the `format` script in editors/vscode/package.json,
        # which is what CI checks. It did not: editors/vscode/scripts/*.mjs was
        # checked by CI and not by this hook, so nine test files were formatted
        # only by luck and a tenth failed the build.
        entry: node editors/vscode/node_modules/prettier/bin/prettier.cjs --check
        language: system
        files: ^(editors/vscode/(src|media|scripts)/.*\.(ts|js|mjs|cjs)|scripts/.*\.mjs)$
        pass_filenames: true

      - id: adr-number-guard
        name: ADR number not already claimed on another ref
        # ADR numbers are a shared counter with no coordination: each branch
        # reads "the next number" from a view that cannot see a sibling's
        # in-flight ADR. Catching the collision here costs seconds; catching it
        # at merge costs a renumber across the file, its cross-links, and every
        # commit message citing it.
        entry: node scripts/adr-number-guard.mjs
        language: system
        files: ^docs/adr/\d{4}-.*\.md$
        pass_filenames: true

      - id: adr-index
        name: ADR index matches the ADR files
        # The index is derived data: number, title, and status all live in the
        # ADR itself. Hand-maintaining it meant every concurrent branch appended
        # a row to the same table, so every merge conflicted on it — and the
        # table drifted anyway. Ten of forty-five rows were wrong when this was
        # added, including an ADR the whole constitution backlog gates on.
        entry: node scripts/adr-index.mjs --check
        language: system
        files: ^docs/adr/.*\.md$
        pass_filenames: false

      - id: canonical-push
        name: canonical fleet publisher
        entry: node scripts/canonical-push.mjs --verify-pre-push
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # An ADR left in the working tree is one `git clean -fd` from gone, and
      # nothing else reports it. Only the working-tree check runs here: the
      # unpublished check would fail the very push that publishes the ADR.
      - id: adr-guard
        name: no ADR left uncommitted
        entry: node scripts/adr-guard.mjs --uncommitted
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # Slower gate — runs on push, not every commit. Validates the pushed
      # commit's tree so another agent's uncommitted WIP cannot poison it.
      - id: cargo-test
        name: cargo test (scoped, committed snapshot)
        entry: node scripts/cargo-precommit.mjs test push
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]
